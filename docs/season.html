<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>2026 Season Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F2F4F8;--surface:#FFFFFF;--raised:#E9EDF4;--line:#D5DCE7;
  --text:#101620;--muted:#5A6577;--accent:#A85F16;--accentbg:#F6E7D2;
  --win:#1F7A47;--loss:#A83E30;--grid:#E2E7EF;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0B0F16;--surface:#121824;--raised:#1A2231;--line:#232D3E;
  --text:#DCE3ED;--muted:#7C89A0;--accent:#F2A03D;--accentbg:#2E2416;
  --win:#45A06A;--loss:#C2564A;--grid:#1B2432;
}}
:root[data-theme="dark"]{
  --ground:#0B0F16;--surface:#121824;--raised:#1A2231;--line:#232D3E;
  --text:#DCE3ED;--muted:#7C89A0;--accent:#F2A03D;--accentbg:#2E2416;
  --win:#45A06A;--loss:#C2564A;--grid:#1B2432;
}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--ground);color:var(--text);
  font-family:Barlow,system-ui,sans-serif;font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding:0 18px}
h2{font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.04em;font-size:19px;margin:0}
.sub{color:var(--muted);font-size:12px;margin:2px 0 0}
header{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:14px;padding:10px 0;flex-wrap:wrap}
.brand{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px;
  text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.brand span{color:var(--accent)}
.ctl{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
select{font-family:inherit;font-size:13px;color:var(--text);background:var(--raised);
  border:1px solid var(--line);border-radius:2px;padding:5px 8px}
a.back{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:13px;
  text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-decoration:none;
  border:1px solid var(--line);border-radius:2px;padding:5px 10px;white-space:nowrap}
a.back:hover{color:var(--accent);border-color:var(--accent)}
.state{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 0 0}
.pill{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.06em;
  text-transform:uppercase;border:1px solid var(--line);border-radius:2px;padding:2px 7px;
  color:var(--muted)}
.pill.live{border-color:var(--accent);color:var(--accent)}
main{padding:16px 0 60px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:3px;margin-bottom:14px}
.card>.hd{padding:10px 14px;border-bottom:1px solid var(--line);
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card>.bd{padding:12px 14px}.card>.bd.flush{padding:0}
.card>.ft{padding:8px 14px 10px;border-top:1px solid var(--line);font-size:11.5px;
  line-height:1.5;color:var(--muted);max-width:104ch}
.card>.ft b{font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;font-size:10px;color:var(--text);margin-right:6px}
.plate{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;
  color:var(--accent);margin-right:8px;letter-spacing:.05em}
.chip{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted);
  border:1px solid var(--line);border-radius:2px;padding:1px 6px;white-space:nowrap}
.tw{overflow-x:auto;max-height:640px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
thead th{position:sticky;top:0;z-index:2;background:var(--raised);
  font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:11px;
  text-transform:uppercase;letter-spacing:.07em;color:var(--muted);cursor:pointer}
thead th:first-child{z-index:3;background:var(--raised)}
thead th:hover,thead th[data-on]{color:var(--accent)}
tbody tr:hover td,tbody tr:hover td:first-child{background:var(--raised)}
td.n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.pos{color:var(--win)}.neg{color:var(--loss)}
.me td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.tag{font-family:"IBM Plex Mono",monospace;font-size:10px;padding:1px 4px;border-radius:2px;
  background:var(--raised);color:var(--muted);border:1px solid var(--line)}
.tag.gold{background:var(--accentbg);color:var(--accent);border-color:var(--accent)}
/* matchup cards */
.mus{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));padding:12px 14px}
.mu{border:1px solid var(--line);border-radius:3px;background:var(--surface);overflow:hidden}
.mu .row{display:flex;align-items:center;gap:10px;padding:8px 12px}
.mu .row+.row{border-top:1px solid var(--line)}
.mu .who{flex:1;min-width:0}
.mu .nm{font-weight:600;font-size:14px}
.mu .tm{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mu .pj{font-family:"IBM Plex Mono",monospace;font-size:15px;font-variant-numeric:tabular-nums}
.mu .fav{color:var(--accent);font-weight:600}
.mu .prob{height:5px;background:var(--raised);display:flex}
.mu .prob i{display:block;height:100%}
.mu .lab{display:flex;justify-content:space-between;padding:5px 12px 8px;
  font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted)}
.aw{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));padding:12px 14px}
.ac{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--muted);
  border-radius:3px;padding:12px 14px;display:flex;flex-direction:column;gap:5px}
.ac[data-k=mvp],.ac[data-k=sleeper],.ac[data-k=high],.ac[data-k=blowout]{border-left-color:var(--win)}
.ac[data-k=facepalm],.ac[data-k=bust],.ac[data-k=low]{border-left-color:var(--loss)}
.ac[data-k=lucky],.ac[data-k=robbed]{border-left-color:var(--accent)}
.ac .v{font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:600;color:var(--accent);
  line-height:1.05;font-variant-numeric:tabular-nums}
.ac .t{font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;font-size:13px}
.ac .d{font-size:12.5px;color:var(--muted);line-height:1.5}
.banner{margin:12px 14px 0;padding:9px 12px;border:1px dashed var(--line);border-radius:3px;
  font-size:12px;color:var(--muted);line-height:1.5}
.banner b{color:var(--accent);font-weight:600}
.sub-form{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px 4px;align-items:center}
.sub-form input{font-family:inherit;font-size:14px;color:var(--text);background:var(--raised);
  border:1px solid var(--line);border-radius:2px;padding:8px 10px;min-width:240px;flex:1;max-width:340px}
.sub-form button{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:14px;
  text-transform:uppercase;letter-spacing:.05em;color:var(--ground);background:var(--accent);
  border:1px solid var(--accent);border-radius:2px;padding:8px 16px;cursor:pointer}
.sub-form button:hover{opacity:.88}
.sub-msg{padding:2px 14px 12px;font-size:12.5px;color:var(--muted);line-height:1.5}
.sub-msg.ok{color:var(--win)}
.sub-msg.bad{color:var(--loss)}
svg{display:block;width:100%;height:auto;overflow:visible}
.ax{stroke:var(--grid);stroke-width:1}
.axl{fill:var(--muted);font-family:"IBM Plex Mono",monospace;font-size:9px}
.ref{stroke:var(--muted);stroke-dasharray:3 3;stroke-width:1;opacity:.55}
.cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.empty{color:var(--muted);font-size:12.5px;padding:22px 14px;text-align:center;line-height:1.6}
.empty b{color:var(--text);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
</style>
</head>
<body>

<header><div class="wrap">
  <div class="hbar">
    <div class="brand" id="brand"></div>
    <div class="ctl">
      <select id="fWeek"></select>
      <select id="fPerson"></select>
      <a class="back" id="back">All-time record book</a>

  </div>
  <div class="state" id="state"></div>
  <div style="height:10px"></div>
</div></header>

<main class="wrap">

  <div id="charts"></div>
  <div id="standings"></div>
  <div id="schedule"></div>
  <div id="rosters"></div>
  <div id="draft"></div>
  <div id="form"></div>
  <div id="subscribe"></div>
</main>

<script>
const D = JSON.parse(document.getElementById('payload').textContent);
const M = D.meta, C = D.calib;
const $ = s => document.querySelector(s);
const el = (t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;
  if(x!==undefined&&x!==null)n.textContent=x;return n};
const num=(v,d=1)=>v===null||v===undefined?'\u2013':(+v).toFixed(d);
let PLATE=0;
function card(host,o){
  const c=el('div','card'),hd=el('div','hd');
  const h=el('h2'); h.append(el('span','plate',String(++PLATE).padStart(2,'0')));
  h.append(document.createTextNode(o.title)); hd.append(h);
  if(o.scope) hd.append(el('span','chip',o.scope));
  if(o.sub) hd.append(el('div','sub',o.sub));
  const bd=el('div','bd flush'); c.append(hd,bd);
  if(o.methods){const f=el('div','ft');f.append(el('b',null,'Method'));
    f.append(document.createTextNode(o.methods));c.append(f);}
  host.append(c); return bd;
}
function cardPad(host,o){const b=card(host,o);b.classList.remove('flush');return b}
function table(host,cols,rows,opts={}){
  const w=el('div','tw'),t=el('table'),thead=el('thead'),hr=el('tr');
  cols.forEach((c,i)=>{const th=el('th',null,c.h);th.dataset.i=i;if(c.t)th.title=c.t;hr.append(th)});
  thead.append(hr);t.append(thead);
  const tb=el('tbody');t.append(tb);
  let sk=opts.sort??1,asc=opts.asc??false;
  function draw(){
    tb.textContent='';
    const sorted=[...rows].sort((a,b)=>{const x=cols[sk].v(a),y=cols[sk].v(b);
      if(x===null||x===undefined)return 1; if(y===null||y===undefined)return -1;
      const r=typeof x==='string'?x.localeCompare(y):x-y; return asc?r:-r;});
    if(!sorted.length){const tr=el('tr'),td=el('td');td.colSpan=cols.length;
      td.className='empty';td.textContent='Nothing here yet.';tr.append(td);tb.append(tr);return}
    sorted.forEach(r=>{
      const tr=el('tr',opts.me&&opts.me(r)?'me':'');
      cols.forEach(c=>{const td=el('td',c.n===false?'':'n');
        const o=c.f?c.f(r):c.v(r);
        if(o instanceof Node)td.append(o);else td.textContent=o;
        if(c.cls)td.classList.add(...[].concat(c.cls(r)||[]));tr.append(td)});
      tb.append(tr)});
    thead.querySelectorAll('th').forEach((th,i)=>th.toggleAttribute('data-on',i===sk));
  }
  thead.querySelectorAll('th').forEach(th=>th.addEventListener('click',()=>{
    const i=+th.dataset.i; if(i===sk)asc=!asc; else {sk=i;asc=cols[i].n===false;} draw();}));
  draw(); w.append(t); host.append(w);
}

/* Shared SVG chart primitives. No dependencies: the CSP on the artifact host
   blocks external scripts, and these are small enough not to want a library.
   Every chart takes a host element and returns nothing; all colour comes from
   CSS custom properties so both themes work without redraw. */
const NS_='http://www.w3.org/2000/svg';
function mkS(n,a){const e=document.createElementNS(NS_,n);for(const k in a)e.setAttribute(k,a[k]);return e}
function svgBox(host,w,h){const s=mkS('svg',{viewBox:`0 0 ${w} ${h}`});host.append(s);return s}
function axisLabel(svg,x,y,txt,anchor,rot){
  const t=mkS('text',{x,y,class:'axl','text-anchor':anchor||'middle'});
  if(rot)t.setAttribute('transform',`rotate(${rot} ${x} ${y})`);
  t.textContent=txt; svg.append(t); return t;
}
function quantile(sorted,q){
  if(!sorted.length)return null;
  const i=(sorted.length-1)*q, lo=Math.floor(i), hi=Math.ceil(i);
  return lo===hi?sorted[lo]:sorted[lo]+(sorted[hi]-sorted[lo])*(i-lo);
}

/* Histogram with optional vertical reference marks. */
function histogram(host,values,o){
  o=o||{}; if(!values.length){host.append(el('div','empty','No data yet.'));return}
  const W=o.w||560,H=o.h||280,M={t:12,r:14,b:38,l:44};
  const sorted=[...values].sort((a,b)=>a-b);
  const lo=o.min!==undefined?o.min:Math.floor(sorted[0]/10)*10;
  const hi=o.max!==undefined?o.max:Math.ceil(sorted[sorted.length-1]/10)*10;
  const n=o.bins||24, bw=(hi-lo)/n;
  const counts=new Array(n).fill(0);
  values.forEach(v=>{const i=Math.min(n-1,Math.max(0,Math.floor((v-lo)/bw)));counts[i]++});
  const peak=Math.max(...counts)||1;
  const sx=v=>M.l+((v-lo)/(hi-lo))*(W-M.l-M.r);
  const sy=c=>H-M.b-(c/peak)*(H-M.t-M.b);
  const svg=svgBox(host,W,H);
  for(let i=0;i<=4;i++){const y=M.t+(H-M.t-M.b)*i/4;
    svg.append(mkS('line',{x1:M.l,x2:W-M.r,y1:y,y2:y,class:'ax'}));
    axisLabel(svg,M.l-6,y+3,Math.round(peak*(1-i/4)),'end');}
  counts.forEach((c,i)=>{
    if(!c)return;
    const x=sx(lo+i*bw), w=Math.max(1,sx(lo+(i+1)*bw)-x-1);
    const r=mkS('rect',{x,y:sy(c),width:w,height:H-M.b-sy(c),
      fill:'var(--accent)','fill-opacity':.5});
    const ttl=mkS('title'); ttl.textContent=`${Math.round(lo+i*bw)}-${Math.round(lo+(i+1)*bw)}: ${c}`;
    r.append(ttl); svg.append(r);
  });
  for(let i=0;i<=5;i++){const v=lo+(hi-lo)*i/5; axisLabel(svg,sx(v),H-M.b+14,Math.round(v));}
  (o.marks||[]).forEach(m=>{
    const x=sx(m.v);
    svg.append(mkS('line',{x1:x,x2:x,y1:M.t,y2:H-M.b,
      stroke:m.color||'var(--text)','stroke-width':m.w||1.5,
      'stroke-dasharray':m.dash||'4 3','stroke-opacity':.85}));
    const t=axisLabel(svg,x,M.t-1,m.label,'middle');
    t.setAttribute('fill',m.color||'var(--text)');
  });
  if(o.xl)axisLabel(svg,W/2,H-4,o.xl);
  if(o.yl)axisLabel(svg,13,H/2,o.yl,'middle',-90);
}

/* A continuous function plotted over a domain, with optional guide points. */
function curve(host,fn,o){
  o=o||{};
  const W=o.w||560,H=o.h||280,M={t:14,r:16,b:38,l:46};
  const [x0,x1]=o.domain,[y0,y1]=o.range||[0,1];
  const sx=v=>M.l+((v-x0)/(x1-x0))*(W-M.l-M.r);
  const sy=v=>H-M.b-((v-y0)/(y1-y0))*(H-M.t-M.b);
  const svg=svgBox(host,W,H);
  for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4;
    svg.append(mkS('line',{x1:M.l,x2:W-M.r,y1:sy(v),y2:sy(v),class:'ax'}));
    axisLabel(svg,M.l-6,sy(v)+3,o.yfmt?o.yfmt(v):v.toFixed(2),'end');}
  for(let i=0;i<=6;i++){const v=x0+(x1-x0)*i/6; axisLabel(svg,sx(v),H-M.b+14,Math.round(v));}
  if(o.hline!==undefined)
    svg.append(mkS('line',{x1:M.l,x2:W-M.r,y1:sy(o.hline),y2:sy(o.hline),class:'ref'}));
  if(o.vline!==undefined)
    svg.append(mkS('line',{x1:sx(o.vline),x2:sx(o.vline),y1:M.t,y2:H-M.b,class:'ref'}));
  (o.bands||[]).forEach(b=>{
    svg.append(mkS('rect',{x:sx(b.from),y:M.t,width:sx(b.to)-sx(b.from),height:H-M.t-M.b,
      fill:b.color||'var(--accent)','fill-opacity':b.opacity||.08}));
  });
  const pts=[];
  for(let i=0;i<=160;i++){const x=x0+(x1-x0)*i/160; pts.push(`${sx(x)},${sy(fn(x))}`)}
  svg.append(mkS('polyline',{points:pts.join(' '),fill:'none',
    stroke:'var(--accent)','stroke-width':2.5}));
  (o.marks||[]).forEach(m=>{
    const cx=sx(m.x),cy=sy(m.y);
    svg.append(mkS('circle',{cx,cy,r:4,fill:'var(--accent)'}));
    const t=axisLabel(svg,cx+7,cy-6,m.label,'start'); t.setAttribute('fill','var(--text)');
  });
  if(o.xl)axisLabel(svg,W/2,H-4,o.xl);
  if(o.yl)axisLabel(svg,13,H/2,o.yl,'middle',-90);
}

/* Reliability diagram: predicted probability vs observed rate, dot area ~ n. */
function reliability(host,bins,o){
  o=o||{};
  const W=o.w||560,H=o.h||300,M={t:14,r:16,b:38,l:46};
  const sx=v=>M.l+v*(W-M.l-M.r), sy=v=>H-M.b-v*(H-M.t-M.b);
  const svg=svgBox(host,W,H);
  for(let i=0;i<=4;i++){const v=i/4;
    svg.append(mkS('line',{x1:M.l,x2:W-M.r,y1:sy(v),y2:sy(v),class:'ax'}));
    axisLabel(svg,M.l-6,sy(v)+3,v.toFixed(2),'end');
    axisLabel(svg,sx(v),H-M.b+14,v.toFixed(2));}
  svg.append(mkS('line',{x1:sx(0),y1:sy(0),x2:sx(1),y2:sy(1),class:'ref'}));
  const maxN=Math.max(...bins.map(b=>b.n))||1;
  bins.forEach(b=>{
    const r=4+10*Math.sqrt(b.n/maxN);
    const c=mkS('circle',{cx:sx(b.pred),cy:sy(b.act),r,
      fill:b.act>=b.pred?'var(--win)':'var(--loss)','fill-opacity':.75});
    const t=mkS('title');
    t.textContent=`predicted ${(b.pred*100).toFixed(0)}%, actual ${(b.act*100).toFixed(0)}% (n=${b.n})`;
    c.append(t); svg.append(c);
  });
  if(o.xl)axisLabel(svg,W/2,H-4,o.xl);
  if(o.yl)axisLabel(svg,13,H/2,o.yl,'middle',-90);
}

/* Scatter with an optional binned trend line through it. */
function scatterTrend(host,pts,o){
  o=o||{}; if(!pts.length){host.append(el('div','empty','No data yet.'));return}
  const W=o.w||560,H=o.h||300,M={t:14,r:16,b:38,l:48};
  const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
  const x0=o.x0!==undefined?o.x0:Math.min(...xs), x1=o.x1!==undefined?o.x1:Math.max(...xs);
  const y0=o.y0!==undefined?o.y0:0, y1=o.y1!==undefined?o.y1:Math.max(...ys)*1.05;
  const sx=v=>M.l+((v-x0)/(x1-x0||1))*(W-M.l-M.r);
  const sy=v=>H-M.b-((v-y0)/(y1-y0||1))*(H-M.t-M.b);
  const svg=svgBox(host,W,H);
  for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4;
    svg.append(mkS('line',{x1:M.l,x2:W-M.r,y1:sy(v),y2:sy(v),class:'ax'}));
    axisLabel(svg,M.l-6,sy(v)+3,Math.round(v),'end');}
  for(let i=0;i<=6;i++){const v=x0+(x1-x0)*i/6; axisLabel(svg,sx(v),H-M.b+14,Math.round(v));}
  pts.forEach(p=>{
    const c=mkS('circle',{cx:sx(p.x),cy:sy(p.y),r:p.r||2.6,
      fill:p.hot?'var(--accent)':'var(--muted)','fill-opacity':p.hot?.95:.4});
    if(p.tip){const t=mkS('title');t.textContent=p.tip;c.append(t)}
    svg.append(c);
  });
  if(o.trendBins){
    const nb=o.trendBins, step=(x1-x0)/nb, acc=[];
    for(let i=0;i<nb;i++){
      const lo=x0+i*step, hi=lo+step;
      const inb=pts.filter(p=>p.x>=lo&&p.x<hi).map(p=>p.y);
      if(inb.length>=3) acc.push([lo+step/2, inb.reduce((a,b)=>a+b,0)/inb.length]);
    }
    if(acc.length>1)
      svg.append(mkS('polyline',{points:acc.map(a=>`${sx(a[0])},${sy(a[1])}`).join(' '),
        fill:'none',stroke:'var(--accent)','stroke-width':2.5}));
  }
  if(o.xl)axisLabel(svg,W/2,H-4,o.xl);
  if(o.yl)axisLabel(svg,13,H/2,o.yl,'middle',-90);
}


/* ---- header ---- */
$('#brand').innerHTML='';
$('#brand').append(document.createTextNode(M.season+' Season '));
const sp=el('span',null,'Tracker'); $('#brand').append(sp);
$('#back').href=M.recordBook;
const F={week:'all',person:'all'};
const fw=$('#fWeek'), fp=$('#fPerson');

fw.value = M.currentWeek<= (M.regularWeeks||14) ? String(M.currentWeek) : 'all';
F.week = fw.value;
fp.append(new Option('All managers','all'));
[...new Set(D.standings.map(s=>s.p))].sort().forEach(p=>fp.append(new Option(p,p)));
const ME = D.standings.find(s=>s.tm && s.tm.indexOf('Double-Doink')>=0)?.p || null;

const st=$('#state'); st.textContent='';

  M.started?`Week ${M.currentWeek} of ${M.regularWeeks}`:'Preseason \u2014 no games played'));

const wkOK = w => F.week==='all' || +w===+F.week;
const perOK = p => F.person==='all' || p===F.person;

/* ---- 1. weekly awards (post-game) ---- */
function renderAwards(){
  const host=$('#awards'); host.textContent='';
  const keys=Object.keys(D.awards||{});
  const wk = F.week==='all' ? null : +F.week;
  let key = wk!==null ? `${M.season}|${wk}` : null;
  if(!key || !D.awards[key]) key = keys[keys.length-1];
  const list = key ? D.awards[key] : null;
  const isSample = D.sample && key === `${D.sample.season}|${D.sample.week}`;
  const shownWeek = key ? key.split('|') : null;

  const b=card(host,{
    title: shownWeek ? `Week ${shownWeek[1]} awards` : 'Weekly awards',
    scope: shownWeek ? `${shownWeek[0]} season` : `${M.season} season`,
    methods:`Handed out from the completed week only - nothing here is a prediction. `
      +`The Lucky One is the winner whose score beat the fewest other teams that week; Robbed `
      +`is the loser whose score beat the most, which is the all-play view applied to a single `
      +`week. Facepalm ranks a loss where the bench outscored the losing margin above merely `
      +`benching a lot of points, because only one of those cost a game. Bust and Overachiever `
      +`compare a started player's actual score against ESPN's projection for that week.`});
  if(!list){
    const e=el('div','empty');
    e.innerHTML=`<b>No completed weeks yet.</b><br>Awards are handed out the morning after `
      +`each week finishes, once results are final.`;
    b.append(e); return;
  }
  if(isSample && !M.started){
    const bn=el('div','banner');
    bn.innerHTML=`<b>Sample week.</b> The ${M.season} season has not kicked off, so this shows `
      +`${D.sample.season} week ${D.sample.week} to demonstrate what lands here each week. `
      +`It will switch to live ${M.season} results automatically once week 1 is final.`;
    b.append(bn);
  }
  const g=el('div','aw');
  list.forEach(a=>{
    const c=el('div','ac'); c.dataset.k=a.k;
    c.append(el('div','v',a.v), el('div','t',a.l), el('div','d',a.d));
    g.append(c);
  });
  b.append(g);
}

/* ---- 2. standings ---- */
function renderStandings(){
  const host=$('#standings'); host.textContent='';
  const rows=D.standings.filter(s=>perOK(s.p));
  const b=card(host,{
    title:'Standings', scope:`${M.season} \u00b7 ${rows.length} teams`,
    methods:`All-play is the record against every other team every week, which ranks teams by `
      +`scoring rather than by who the schedule handed them. Benched counts points scored by `
      +`players left in bench slots. Both fill in as weeks are played.`});
  if(!M.started){
    // append() returns undefined, so this must not be chained
    const e=el('div','empty');
    e.innerHTML = `<b>No games played yet.</b><br>Standings, all-play records and bench `
      +`totals populate from week 1 onward. Until then the draft board, rosters and schedule `
      +`below are the live data.`;
    b.append(e);
    return;
  }
  table(b,[
    {h:'Manager',n:false,v:r=>r.p},
    {h:'Team',n:false,v:r=>r.tm||''},
    {h:'W',v:r=>r.w},{h:'L',v:r=>r.l},
    {h:'PF',v:r=>r.pf},{h:'PA',v:r=>r.pa},
    {h:'All-play',n:false,v:r=>r.apw,f:r=>`${r.apw}-${r.apl}`},
    {h:'Streak',n:false,v:r=>r.streak||'',cls:r=>r.streak?(r.streak[0]==='W'?'pos':'neg'):''},
    {h:'Benched',v:r=>r.bn,f:r=>num(r.bn,0)},
  ],rows,{sort:2,me:r=>r.p===ME});
}

/* ---- 3. schedule ---- */
function renderSchedule(){
  const host=$('#schedule'); host.textContent='';
  const rows=D.schedule.filter(g=>wkOK(g.wk)&&(perOK(g.hp)||perOK(g.ap)));
  const b=card(host,{
    title:'Schedule', scope:`${rows.length} of ${D.schedule.length} matchups`,
    methods:`The full ${M.season} slate as drawn by ESPN, regular season and playoff rounds. `
      +`Projections appear only for weeks whose rosters have been pulled \u2014 currently week `
      +`${M.currentWeek} \u2014 because ESPN publishes per-player projections for the active `
      +`week only.`});
  table(b,[
    {h:'Wk',v:r=>r.wk},
    {h:'Home',n:false,v:r=>r.hp},
    {h:'Score',n:false,v:r=>r.hs??-1,f:r=>r.hs!=null?num(r.hs,2):'-',
     cls:r=>r.won==='HOME'?'pos':''},
    {h:'Away',n:false,v:r=>r.ap},
    {h:'Score',n:false,v:r=>r.as??-1,f:r=>r.as!=null?num(r.as,2):'-',
     cls:r=>r.won==='AWAY'?'pos':''},
    {h:'Round',n:false,v:r=>r.po?1:0,f:r=>r.po?el('span','tag','PLAYOFF'):''},
  ],rows,{sort:0,asc:true,me:r=>r.hp===ME||r.ap===ME});
}

/* ---- 4. rosters ---- */
function renderRosters(){
  const host=$('#rosters'); host.textContent='';
  const rs=D.rosters.filter(r=>perOK(r.p));
  const rows=[];
  rs.forEach(r=>r.players.forEach(pl=>rows.push({...pl,p:r.p,tm:r.tm})));
  const b=card(host,{
    title:'Rosters', scope:`${rs.length} teams \u00b7 ${rows.length} players`,
    methods:`Rosters as of the most recent pull (week ${D.rosters[0]?.wk ?? M.currentWeek}). `
      +`Proj is ESPN's projection for that player this week; Act fills in once games are played. `
      +`Starters are listed above bench players within each team.`});
  table(b,[
    {h:'Player',n:false,v:r=>r.n||''},
    {h:'Pos',n:false,v:r=>r.pos||''},
    {h:'Manager',n:false,v:r=>r.p},
    {h:'Slot',n:false,v:r=>r.slot||''},
    {h:'Starting',n:false,v:r=>r.st?1:0,f:r=>r.st?el('span','tag gold','START'):el('span','tag','BE')},
    {h:'Proj',v:r=>r.proj},
    {h:'Act',v:r=>r.act,f:r=>r.act==null?'\u2013':num(r.act,1)},
  ],rows,{sort:5,me:r=>r.p===ME});
}

/* ---- 5. draft ---- */
function renderDraft(){
  const host=$('#draft'); host.textContent='';
  const rows=D.draft.filter(r=>perOK(r.p));
  const b=card(host,{
    title:`${M.season} draft board`, scope:`${rows.length} picks`,
    methods:`Every pick of the ${M.season} draft in order. Production columns are deliberately `
      +`absent until games are played \u2014 a zero here would read as a bust rather than as a `
      +`season that has not started. They appear in the all-time record book once the year `
      +`has results.`});
  table(b,[
    {h:'Pick',v:r=>r.ov},{h:'Rd',v:r=>r.rd},
    {h:'Player',n:false,v:r=>r.pl||''},
    {h:'Pos',n:false,v:r=>r.pos||''},
    {h:'Manager',n:false,v:r=>r.p||''},
    {h:'Keeper',n:false,v:r=>r.k,f:r=>r.k?el('span','tag','K'):''},
  ],rows,{sort:0,asc:true,me:r=>r.p===ME});
}

/* ---- 6. form ---- */
function renderForm(){
  const host=$('#form'); host.textContent='';
  const rows=D.form.filter(r=>perOK(r.p));
  const b=card(host,{
    title:'Coming in', scope:`career form before ${M.season}`,
    methods:`Regular-season record across every prior season each manager has played, with `
      +`their most recent finish. Context for the season ahead, not part of it.`});
  table(b,[
    {h:'Manager',n:false,v:r=>r.p},
    {h:'Seasons',v:r=>r.seasons},
    {h:'W',v:r=>r.w},{h:'L',v:r=>r.l},
    {h:'Win%',v:r=>r.pct,f:r=>r.pct==null?'\u2013':r.pct.toFixed(3)},
    {h:'Titles',v:r=>r.titles,f:r=>r.titles?el('span','tag gold','\u2605'.repeat(r.titles)):'\u2013'},
    {h:'Last season',n:false,v:r=>r.last?r.last.s:0,
     f:r=>r.last?`${r.last.s}: ${r.last.w}-${r.last.l}, finished ${r.last.rk??'\u2013'}`:'\u2013'},
  ],rows,{sort:4,me:r=>r.p===ME});
}

function renderSubscribe(){
  const host=$('#subscribe'); host.textContent='';
  const b=card(host,{
    title:'Weekly recap by email',
    scope:'opt in',
    methods:`This page is static, so there is no server here to store an address. Submitting `
      +`opens a pre-filled message in your own mail app addressed to the commissioner - you `
      +`just press send, and you get added to the list by hand. Nothing is transmitted from `
      +`this page, and your address is not stored anywhere on it.`});
  const f=el('form','sub-form');
  const inp=el('input'); inp.type='email'; inp.required=true;
  inp.placeholder='you@example.com'; inp.setAttribute('aria-label','Your email address');
  const btn=el('button'); btn.type='submit'; btn.textContent='Send me the recap';
  f.append(inp,btn); b.append(f);
  const msg=el('div','sub-msg'); b.append(msg);

  let already=null;
  try{ already=localStorage.getItem('ffl-sub'); }catch(e){}
  if(already){ msg.className='sub-msg ok';
    msg.textContent=`You already opted in as ${already}. Submit again to resend.`; }
  else msg.textContent='Sent after each week is final, with the awards above and the standings.';

  f.addEventListener('submit',ev=>{
    ev.preventDefault();
    const v=inp.value.trim();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(v)){
      msg.className='sub-msg bad'; msg.textContent='That does not look like an email address.';
      return;
    }
    // assembled at runtime rather than sitting in the markup as plain text
    const to=['jkenny2334','gmail.com'].join('@');
    const subj=encodeURIComponent(`Fantasy League weekly recap - subscribe`);
    const body=encodeURIComponent(
      `Please add me to the ${M.season} weekly recap list.\n\nEmail: ${v}\n`);
    try{ localStorage.setItem('ffl-sub',v); }catch(e){}
    msg.className='sub-msg ok';
    msg.textContent='Opening your mail app - press send and you are on the list.';
    window.location.href=`mailto:${to}?subject=${subj}&body=${body}`;
  });
}


/* ---- charts ---- */
function renderCharts(){
  const host=$('#charts'); host.textContent='';
  const C=D.calib;
  const cols=el('div','cols'); host.append(cols);

  // 1. score distribution, with this week's scores marked once they exist
  const c1=el('div'); cols.append(c1);
  const sorted=[...C.scores].sort((a,b)=>a-b);
  const q=f=>sorted[Math.round((sorted.length-1)*f)];
  const wkScores=[];
  const key=Object.keys(D.awards||{}).slice(-1)[0];
  D.schedule.filter(g=>g.hs!=null).forEach(g=>{wkScores.push(g.hs,g.as)});
  const b1=cardPad(c1,{
    title:'What a good week looks like',
    scope:`n = ${C.scores.length} team-weeks, all seasons`,
    methods:`Every team-week this league has ever played, bucketed by points scored. The `
      +`dashed lines are the 5th, 50th and 95th percentiles: half of all weeks land between `
      +`${q(.25).toFixed(0)} and ${q(.75).toFixed(0)}, and anything past ${q(.95).toFixed(0)} `
      +`is a top-5% week. Use it to judge whether a score was actually good or merely `
      +`survived the schedule.`});
  histogram(b1,C.scores,{bins:26,xl:'Points scored in a week',yl:'Team-weeks',
    marks:[{v:q(.05),label:'5th',color:'var(--loss)'},
           {v:q(.50),label:'median '+q(.50).toFixed(0),color:'var(--text)'},
           {v:q(.95),label:'95th',color:'var(--win)'}]});

  // 2. how close games actually are
  const c2=el('div'); cols.append(c2);
  const m=C.margins, close=t=>m.filter(x=>x<=t).length/m.length;
  const b2=cardPad(c2,{
    title:'Margins are wider than they feel',
    scope:`n = ${m.length} completed matchups`,
    methods:`Margin of victory across every matchup on record. The median is `
      +`${m[Math.floor(m.length/2)].toFixed(1)} points and only `
      +`${(close(10)*100).toFixed(1)}% of games finish within ten - fantasy weeks are decided `
      +`by more than they seem to be in the moment. This is also why a single lineup call `
      +`rarely swings a result, and why the ones that do are worth an award.`});
  histogram(b2,m,{bins:24,min:0,xl:'Margin of victory',yl:'Matchups',
    marks:[{v:10,label:(close(10)*100).toFixed(0)+'% within 10',color:'var(--accent)'}]});

  // 3. the probability curve
  const c3=el('div'); cols.append(c3);
  const spread=C.sd*Math.SQRT2;
  const erf=x=>{const t=1/(1+.3275911*Math.abs(x));
    const y=1-((((1.061405429*t-1.453152027)*t+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x);
    return x>=0?y:-y};
  const P=d=>0.5*(1+erf(d/spread/Math.SQRT2));
  const b3=cardPad(c3,{
    title:'What a projected lead is worth',
    scope:`spread = ${spread.toFixed(1)} pts`,
    methods:`Probability of winning as a function of how many points you are projected to win `
      +`by. Derived, not assumed: actual minus projected has a standard deviation of ${C.sd} `
      +`over ${C.residN} team-weeks, and two independent teams combine to `
      +`${spread.toFixed(1)}. The shaded band is a projected margin inside ten points, where `
      +`the curve barely leaves a coin flip - which is most matchups.`});
  curve(b3,P,{domain:[-50,50],range:[0,1],hline:.5,vline:0,
    bands:[{from:-10,to:10}],
    yfmt:v=>(v*100).toFixed(0)+'%',
    xl:'Projected margin (points)',yl:'Win probability',
    marks:[{x:10,y:P(10),label:(P(10)*100).toFixed(0)+'% at +10'},
           {x:25,y:P(25),label:(P(25)*100).toFixed(0)+'% at +25'}]});

  // 4. does the model actually hold up
  const c4=el('div'); cols.append(c4);
  const big=C.bins.filter(b=>b.n>=40);
  const b4=cardPad(c4,{
    title:'Does that curve hold up?',
    scope:`n = ${C.n} matchups`,
    methods:`Every past matchup scored by the curve above, then grouped by predicted `
      +`probability and checked against what happened. Dots on the dashed line mean the model `
      +`is honest; dot size is how many matchups fell in that bucket. It tracks reasonably `
      +`where the data is thick, and the outliers sit in the sparse tails. The real lesson is `
      +`the clustering: ${(big.reduce((a,b)=>a+b.n,0)/C.n*100).toFixed(0)}% of all matchups `
      +`fall in the middle buckets, so projections seldom say anything strong. Overall the `
      +`higher projection has won ${(C.hit*100).toFixed(1)}% of the time.`});
  reliability(b4,C.bins,{xl:'Predicted win probability',yl:'Actual win rate'});
}

function render(){
  PLATE=0;
  renderAwards(); renderCharts(); renderStandings(); renderSchedule();
  renderRosters(); renderDraft(); renderForm(); renderSubscribe();
}
render();
</script>
