<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>2026 Season Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Shared stylesheet for both pages, injected at render time.
   Harpers Ferry house rules applied to a stat sheet: two typefaces, warm
   desaturated ground, colourblind-safe blue/orange diverging pair (never
   red-green on decision-critical data), white space as structure.

   LIGHT IS THE DEFAULT, deliberately - there is no prefers-color-scheme block,
   so the OS does not decide. Dark is opt-in through the header toggle, which
   stamps data-theme="dark" and remembers the choice.
   Every token below was contrast-checked to 4.5:1 on both grounds. */
:root{
  --ground:#F2EFE9;--surface:#FBFAF7;--raised:#E8E3D9;--line:#D6CFC2;
  --text:#241F1A;--muted:#61584C;--accent:#0F5C8C;--accentbg:#DCE8F1;
  --win:#00618F;--loss:#B24A00;--grid:#E4DED2;
}
:root[data-theme="dark"]{
  --ground:#191614;--surface:#221E1A;--raised:#2C2721;--line:#3A342C;
  --text:#EDE7DC;--muted:#A2988A;--accent:#7FB6DD;--accentbg:#20303C;
  --win:#56B4E9;--loss:#E69F00;--grid:#2A251F;
}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--ground);color:var(--text);
  font-family:"Source Sans 3",system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding:0 28px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
h2{font-weight:700;text-transform:uppercase;letter-spacing:.09em;font-size:15px;margin:0}
.sub{color:var(--muted);font-size:13px;margin:3px 0 0}
/* header */
header{position:sticky;top:0;z-index:20;background:var(--surface);
  border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:20px;padding:16px 0;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.13em;
  white-space:nowrap}
.brand span{color:var(--accent)}
.ctl{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap}
select,input[type=search]{font-family:inherit;font-size:14px;color:var(--text);
  background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:7px 10px}
input[type=search]{width:210px}
a.back{font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:2px;
  padding:7px 12px;white-space:nowrap}
a.back:hover{color:var(--accent);border-color:var(--accent)}
/* theme toggle */
.theme{display:inline-flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.theme button{font-family:inherit;font-weight:600;font-size:11px;text-transform:uppercase;
  letter-spacing:.09em;background:var(--surface);border:none;color:var(--muted);
  padding:7px 11px;cursor:pointer}
.theme button+button{border-left:1px solid var(--line)}
.theme button:hover{color:var(--text)}
.theme button[aria-pressed="true"]{background:var(--raised);color:var(--accent)}
nav{display:flex;gap:6px;overflow-x:auto;border-top:1px solid var(--line)}
nav button{font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.1em;
  background:none;border:none;color:var(--muted);padding:13px 4px;margin-right:18px;
  cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button:hover{color:var(--text)}
nav button[aria-current]{color:var(--text);border-bottom-color:var(--accent)}
main{padding:28px 0 80px}
.panel{display:none}.panel.on{display:block}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:2px;
  margin-bottom:24px}
.card>.hd{padding:16px 20px 14px;border-bottom:1px solid var(--line);
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.card>.bd{padding:18px 20px}.card>.bd.flush{padding:0}
.card>.ft{padding:12px 20px 14px;border-top:1px solid var(--line);font-size:12.5px;
  line-height:1.6;color:var(--muted);max-width:92ch}
.card>.ft b{font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:10.5px;
  color:var(--text);margin-right:8px}
.chip{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);
  border:1px solid var(--line);border-radius:2px;padding:2px 8px;white-space:nowrap}
.cols{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr))}
/* tables */
.tw{overflow-x:auto;max-height:620px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 14px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
thead th{position:sticky;top:0;z-index:2;background:var(--raised);font-weight:700;
  font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);cursor:pointer}
thead th:first-child{z-index:3;background:var(--raised)}
thead th:hover,thead th[data-on]{color:var(--accent)}
tbody tr:hover td,tbody tr:hover td:first-child{background:var(--raised)}
td.n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:13px}
.pos{color:var(--win)}.neg{color:var(--loss)}
.tag{font-family:"IBM Plex Mono",monospace;font-size:10px;padding:2px 6px;border-radius:2px;
  background:var(--raised);color:var(--muted);border:1px solid var(--line)}
.tag.gold{background:var(--accentbg);color:var(--accent);border-color:var(--accent)}
.bar-c{position:relative}
.bar-c i{position:absolute;left:0;top:3px;bottom:3px;background:var(--accent);opacity:.18;
  border-radius:1px}
.bar-c span{position:relative}
.matrix{overflow-x:auto}
/* charts */
svg{display:block;width:100%;height:auto;overflow:visible}
.ax{stroke:var(--grid);stroke-width:1}
.axl{fill:var(--muted);font-family:"IBM Plex Mono",monospace;font-size:9.5px}
.ref{stroke:var(--muted);stroke-dasharray:3 3;stroke-width:1;opacity:.6}
.dot{cursor:pointer}
.dot:hover circle{stroke:var(--text);stroke-width:2}
.dlbl{fill:var(--text);font-size:10.5px;font-weight:600}
.note{font-size:12px;color:var(--muted);margin-top:10px}
/* findings + weekly awards: category reads as a quiet rule underneath rather
   than a colour bar down the side - the number is the subject */
.catline{display:flex;align-items:baseline;gap:14px;margin:28px 0 12px}
.catline h3{font-weight:700;text-transform:uppercase;letter-spacing:.11em;font-size:13px;margin:0}
.catline .rule{flex:1;height:1px;background:var(--line)}
.catline .ct{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted)}
.find,.aw{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr))}
.aw{padding:18px 20px}
.fi,.ac{background:var(--surface);border:1px solid var(--line);
  border-bottom:2px solid var(--line);border-radius:2px;padding:16px 18px 15px;
  display:flex;flex-direction:column;gap:7px}
.fi[data-c="Bragging rights"]{border-bottom-color:color-mix(in oklab,var(--win) 45%,var(--line))}
.fi[data-c="Facepalm"]{border-bottom-color:color-mix(in oklab,var(--loss) 45%,var(--line))}
.fi[data-c="Robbed"]{border-bottom-color:color-mix(in oklab,var(--accent) 45%,var(--line))}
.ac[data-k=mvp],.ac[data-k=sleeper],.ac[data-k=high],.ac[data-k=blowout]{
  border-bottom-color:color-mix(in oklab,var(--win) 45%,var(--line))}
.ac[data-k=facepalm],.ac[data-k=bust],.ac[data-k=low]{
  border-bottom-color:color-mix(in oklab,var(--loss) 45%,var(--line))}
.ac[data-k=lucky],.ac[data-k=robbed]{
  border-bottom-color:color-mix(in oklab,var(--accent) 45%,var(--line))}
.fi .v,.ac .v{font-family:"IBM Plex Mono",monospace;font-size:20px;font-weight:500;
  color:var(--accent);line-height:1.05;font-variant-numeric:tabular-nums}
.fi .t,.ac .t{font-weight:700;text-transform:uppercase;letter-spacing:.07em;font-size:12.5px}
.fi .d,.ac .d{font-size:13px;color:var(--muted);line-height:1.55}
/* season page */
.state{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:0 0 14px}
.pill{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.07em;
  text-transform:uppercase;border:1px solid var(--line);border-radius:2px;padding:3px 9px;
  color:var(--muted)}
.pill.live{border-color:var(--accent);color:var(--accent)}
.banner{margin:18px 20px 0;padding:12px 14px;border:1px dashed var(--line);border-radius:2px;
  font-size:13px;color:var(--muted);line-height:1.6}
.banner b{color:var(--accent);font-weight:600}
.empty{color:var(--muted);font-size:13px;padding:24px 20px;text-align:center;line-height:1.6}
.empty b{color:var(--text);font-weight:600}
/* ---- phones -------------------------------------------------------------
   The desktop layout nests wrap(28) > card > bd(20) > aw(20) > ac(18) of
   padding, which on a 375px screen leaves the content about 190px wide. Pull
   the nesting in and push the number up: on a one-column stack the value is
   the only thing worth leading with. */
@media (max-width:640px){
  .wrap{padding:0 14px}
  main{padding:18px 0 56px}
  .hbar{gap:12px;padding:12px 0}
  .brand{font-size:15px;letter-spacing:.1em}
  .ctl{gap:8px;margin-left:0;width:100%}
  select,input[type=search]{font-size:16px;padding:8px 10px}  /* 16px: iOS zooms below it */
  input[type=search]{width:100%}
  .state{gap:6px;padding:0 0 10px}
  .pill{font-size:10px;padding:3px 7px}
  .card>.hd{padding:13px 14px 11px;gap:8px}
  .card>.bd{padding:14px}
  .card>.ft{padding:11px 14px 13px;font-size:12px}
  .find,.aw{gap:10px}
  .aw{padding:12px}
  .fi,.ac{padding:13px 14px 12px;gap:5px}
  .fi .v,.ac .v{font-size:30px;line-height:1}
  .fi .t,.ac .t{font-size:11px}
  .fi .d,.ac .d{font-size:13.5px;line-height:1.5}
  .catline{margin:20px 0 10px;gap:10px}
  .banner{margin:14px 14px 0;padding:11px 12px}
  .empty{padding:20px 14px}
  th,td{padding:7px 9px}
  td.n{font-size:12.5px}
  .tw{max-height:none}
  .axl{font-size:11px}
  .pick{font-size:13px;padding:9px 10px}
  .dlbl{font-size:12px}
}
.pick{margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:2px;
  background:var(--bg);font-size:13.5px;line-height:1.5;min-height:1em}
.pick b{font-weight:700}
.pick-hint{color:var(--muted);font-style:italic}
.pick-meta{color:var(--muted)}
.pick-num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-weight:600}
.pick-num.up{color:var(--win)}
.pick-num.dn{color:var(--loss)}
svg[tabindex]{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
svg[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ======================================================================
   SEASON TRACKER - the broadcast register. The record book is an almanac
   and stays exactly as above; the tracker is a screen. Same tokens, same
   charts, one more typeface (Barlow Condensed for display only) and the
   team identity kit. Kit colours are IDENTITY: they always sit beside a
   name and a crest and never carry a meaning on their own. Anything the
   reader has to decode stays on the blue/orange pair.
   Scoped to [data-page=season], stamped by the page's own head script.
   ====================================================================== */
[data-page=season] .disp,[data-page=season] h2,[data-page=season] .brand,
[data-page=season] .ac .t,[data-page=season] .fi .t{
  font-family:"Barlow Condensed","Source Sans 3",system-ui,sans-serif}
[data-page=season] h2{font-size:21px;letter-spacing:.06em;font-weight:700}
[data-page=season] .brand{font-size:26px;letter-spacing:.08em}
[data-page=season] .ac .t{font-size:15px;letter-spacing:.06em}
[data-page=season] .catline h3{font-family:"Barlow Condensed","Source Sans 3",sans-serif;
  font-size:16px;letter-spacing:.08em}
/* yard-line rule: a section break drawn as a field, hash marks every ten */
.yard{position:relative;height:20px;margin:2px 0 22px}
.yard:before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.yard:after{content:"";position:absolute;left:0;right:0;top:5px;bottom:5px;
  background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 10%)}
.yard i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  background:var(--ground);padding:0 6px;font-family:"IBM Plex Mono",monospace;
  font-size:9.5px;color:var(--muted);letter-spacing:.1em;font-style:normal}
/* crest: shield with a sash, monogram on top */
.crest{display:inline-block;vertical-align:middle;flex:none}
img.crest{object-fit:contain;border-radius:3px;background:#FBFAF7;padding:1px;
  box-shadow:0 0 0 1.5px var(--k1,var(--line))}
.crest text{font-family:"Barlow Condensed","Source Sans 3",sans-serif;font-weight:700;
  letter-spacing:.02em}
.who{display:inline-flex;align-items:center;gap:8px}
.who .crest{width:20px;height:23px}
/* headshots + NFL marks */
.hs{width:56px;height:56px;border-radius:50%;object-fit:cover;object-position:top;
  background:var(--raised);border:2px solid var(--k1,var(--line));flex:none}
.hs.sm{width:28px;height:28px;border-width:1.5px}
.mark{width:16px;height:16px;object-fit:contain;vertical-align:-3px;margin-right:5px}
/* ---- scoreboard ---- */
.sbg{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(196px,100%),1fr));
  padding:16px 20px 18px}
.sb{background:var(--surface);border:1px solid var(--line);border-radius:2px;
  display:flex;flex-direction:column}
.sb-row{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 10px;
  border-left:4px solid transparent}
.sb-row+.sb-row{border-top:1px solid var(--line)}
.sb-row.win{border-left-color:var(--k1)}
.sb-row .crest{width:30px;height:34px}
.sb-who{flex:1;min-width:0;line-height:1.15}
.sb-who b{display:block;font-family:"Barlow Condensed","Source Sans 3",sans-serif;
  font-size:18px;font-weight:700;letter-spacing:.03em}
.sb-who span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.sb-sc{font-family:"Barlow Condensed","Source Sans 3",sans-serif;font-weight:700;
  font-size:30px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.sb-row:not(.win) .sb-sc,.sb-row:not(.win) .sb-who b{color:var(--muted);font-weight:600}
.sb-row.tbd .sb-sc{font-size:14px;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.sb-ft{display:flex;align-items:center;gap:8px;padding:9px 12px;border-top:1px solid var(--line);
  font-size:12px;color:var(--muted);background:var(--raised)}
.sb-ft .hs{width:26px;height:26px;border-width:1.5px}
.sb-ft b{color:var(--text);font-weight:600}
.sb-ft .mono{font-size:11.5px}
.sb-riv{padding:8px 12px 10px;font-size:11.5px;line-height:1.45;color:var(--muted);
  border-top:1px dashed var(--line)}
.sb-riv b{color:var(--text);font-weight:600}
.sb-riv .lead{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--accent)}
.sb-wk{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);padding:8px 12px 0}
/* ---- award hierarchy: three heroes, then the strip ---- */
.aw-hero{display:grid;gap:16px;padding:18px 20px 4px;
  grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr))}
.ac.hero{padding:18px 20px 16px;gap:10px;border-bottom-width:3px}
.ac.hero .top{display:flex;align-items:center;gap:14px}
.ac.hero .v{font-family:"Barlow Condensed","Source Sans 3",sans-serif;font-size:46px;
  font-weight:700;letter-spacing:.01em;line-height:.95}
.ac.hero .t{font-size:17px}
.ac.hero .d{font-size:13.5px}
.ac.hero .hs{width:64px;height:64px}
.ac .by{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);
  margin-top:auto}
.ac .by .crest{width:16px;height:18px}
.ac .by .hs.sm{margin-right:2px}
/* ---- heat grids: position strength + schedule swap ---- */
.hmw{overflow-x:auto;padding:14px 20px 18px}
.hm{border-collapse:separate;border-spacing:3px;font-family:"IBM Plex Mono",monospace;
  font-size:12.5px;font-variant-numeric:tabular-nums;min-width:100%}
.hm th{font-family:"Barlow Condensed","Source Sans 3",sans-serif;font-size:13px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;
  padding:4px 6px;text-align:center;position:static;background:none;cursor:default;
  border:none;white-space:nowrap}
.hm th:first-child,.hm td:first-child{text-align:left;position:static;background:none;
  font-family:"Source Sans 3",system-ui,sans-serif;font-size:13.5px;padding-right:10px;
  white-space:nowrap}
.hm th .crest{width:18px;height:21px;margin-right:4px;vertical-align:-5px}
.hm td{text-align:center;padding:7px 6px;border:none;border-radius:2px;
  background:var(--raised);color:var(--text);min-width:52px}
.hm td.self{outline:1px solid var(--line);outline-offset:-1px;background:var(--surface);
  color:var(--muted)}
.hm td.hi{color:var(--text);font-weight:600}
.hm tfoot td{background:none;color:var(--muted);font-size:11px;padding-top:2px}
.hm .cap{font-size:10.5px;color:var(--muted);letter-spacing:.06em;font-family:"IBM Plex Mono",monospace}
.legend{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);
  padding:0 20px 14px;flex-wrap:wrap}
.legend i{display:inline-block;width:38px;height:10px;border-radius:2px;font-style:normal}
/* ---- trophy case ---- */
.trophy td.n{font-size:13px}
.trophy .cup{display:inline-block;font-family:"Barlow Condensed","Source Sans 3",sans-serif;
  font-weight:700;font-size:14px;color:var(--accent)}
.trophy .cup.bad{color:var(--loss)}
.trophy .cup.dim{color:var(--line)}
@media (max-width:640px){
  [data-page=season] h2{font-size:19px}
  [data-page=season] .brand{font-size:22px}
  .sbg{padding:12px;gap:10px}
  .sb-sc{font-size:26px}
  .aw-hero{padding:12px 12px 2px;gap:10px}
  .ac.hero .v{font-size:40px}
  .hmw{padding:10px 12px 14px}
  .hm td{min-width:44px;padding:6px 4px;font-size:12px}
}

</style>
</head>
<body>
<script>
/* Apply the stored choice before anything paints, so switching to dark and
   reloading does not flash the light ground first. */
document.documentElement.setAttribute('data-page','season');
try{if(localStorage.getItem('ffl-theme')==='dark')
  document.documentElement.setAttribute('data-theme','dark');}catch(e){}
</script>

<header><div class="wrap">
  <div class="hbar">
    <div class="brand" id="brand"></div>
    <div class="ctl">
      <select id="fWeek"></select>
      <select id="fPerson"></select>
      <div class="theme" role="group" aria-label="Colour theme">
        <button type="button" data-t="light" aria-pressed="true">Light</button>
        <button type="button" data-t="dark" aria-pressed="false">Dark</button>
      </div>
      <a class="back" id="back">All-time record book</a>
    </div>
  </div>
  <div class="state" id="state"></div>
  <div style="height:10px"></div>
</div></header>

<main class="wrap">
  <div id="scoreboard"></div>
  <div id="awards"></div>
  <div class="yard"><i>50</i></div>
  <div id="charts"></div>
  <div id="heat"></div>
  <div id="standings"></div>
  <div id="swap"></div>
  <div class="yard"><i>50</i></div>
  <div id="power"></div>
  <div id="trophy"></div>
  <div id="schedule"></div>
  <div id="rosters"></div>
  <div id="draft"></div>

<script>
const D = JSON.parse(document.getElementById('payload').textContent);

const $ = s => document.querySelector(s);
const el = (t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;

/* ---------- theme toggle (light is the default; dark is opt-in) ---------- */
(function(){
  const root=document.documentElement;
  const btns=[...document.querySelectorAll('.theme button')];
  function apply(t,store){
    if(t==='dark') root.setAttribute('data-theme','dark');
    else root.removeAttribute('data-theme');
    btns.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.t===t)));
    if(store){ try{ localStorage.setItem('ffl-theme',t); }catch(e){} }
  }
  let cur='light';
  try{ if(localStorage.getItem('ffl-theme')==='dark') cur='dark'; }catch(e){}
  apply(cur,false);
  btns.forEach(b=>b.addEventListener('click',()=>apply(b.dataset.t,true)));
})();
  if(x!==undefined&&x!==null)n.textContent=x;return n};
const num=(v,d=1)=>v===null||v===undefined?'\u2013':(+v).toFixed(d);
let PLATE=0;
function card(host,o){
  const c=el('div','card'),hd=el('div','hd');
  const h=el('h2',null,o.title); hd.append(h);
  if(o.scope) hd.append(el('span','chip',o.scope));
  if(o.sub) hd.append(el('div','sub',o.sub));
  const bd=el('div','bd flush'); c.append(hd,bd);
  if(o.methods){const f=el('div','ft');f.append(el('b',null,'Method'));
    f.append(document.createTextNode(o.methods));c.append(f);}
  host.append(c); return bd;
}
function cardPad(host,o){const b=card(host,o);b.classList.remove('flush');return b}
function table(host,cols,rows,opts={}){
  const w=el('div','tw'),t=el('table'),thead=el('thead'),hr=el('tr');
  cols.forEach((c,i)=>{const th=el('th',null,c.h);th.dataset.i=i;if(c.t)th.title=c.t;hr.append(th)});
  thead.append(hr);t.append(thead);
  const tb=el('tbody');t.append(tb);
  let sk=opts.sort??1,asc=opts.asc??false;
  function draw(){
    tb.textContent='';
    const sorted=[...rows].sort((a,b)=>{const x=cols[sk].v(a),y=cols[sk].v(b);
      if(x===null||x===undefined)return 1; if(y===null||y===undefined)return -1;
      const r=typeof x==='string'?x.localeCompare(y):x-y; return asc?r:-r;});
    if(!sorted.length){const tr=el('tr'),td=el('td');td.colSpan=cols.length;
      td.className='empty';td.textContent='Nothing here yet.';tr.append(td);tb.append(tr);return}
    sorted.forEach(r=>{
      const tr=el('tr');
      cols.forEach(c=>{const td=el('td',c.n===false?'':'n');
        const o=c.f?c.f(r):c.v(r);
        if(o instanceof Node)td.append(o);else td.textContent=o;
        if(c.cls)td.classList.add(...[].concat(c.cls(r)||[]));tr.append(td)});
      tb.append(tr)});
    thead.querySelectorAll('th').forEach((th,i)=>th.toggleAttribute('data-on',i===sk));
  }
  thead.querySelectorAll('th').forEach(th=>th.addEventListener('click',()=>{
    const i=+th.dataset.i; if(i===sk)asc=!asc; else {sk=i;asc=cols[i].n===false;} draw();}));
  draw(); w.append(t); host.append(w);
}

/* Shared SVG chart primitives. No dependencies: the CSP on the artifact host
   blocks external scripts, and these are small enough not to want a library.
   Every chart takes a host element and returns nothing; all colour comes from
   CSS custom properties so both themes work without redraw. */
const NS_='http://www.w3.org/2000/svg';
function mkS(n,a){const e=document.createElementNS(NS_,n);for(const k in a)e.setAttribute(k,a[k]);return e}
function svgBox(host,w,h){const s=mkS('svg',{viewBox:`0 0 ${w} ${h}`});host.append(s);return s}
function axisLabel(svg,x,y,txt,anchor,rot){
  const t=mkS('text',{x,y,class:'axl','text-anchor':anchor||'middle'});
  if(rot)t.setAttribute('transform',`rotate(${rot} ${x} ${y})`);
  t.textContent=txt; svg.append(t); return t;
}
function quantile(sorted,q){
  if(!sorted.length)return null;
  const i=(sorted.length-1)*q, lo=Math.floor(i), hi=Math.ceil(i);
  return lo===hi?sorted[lo]:sorted[lo]+(sorted[hi]-sorted[lo])*(i-lo);
}

/* Histogram with optional vertical reference marks. */
function histogram(host,values,o){
  o=o||{}; if(!values.length){host.append(el('div','empty','No data yet.'));return}
  const W=o.w||560,H=o.h||280,M={t:12,r:14,b:38,l:44};
  const sorted=[...values].sort((a,b)=>a-b);
  const lo=o.min!==undefined?o.min:Math.floor(sorted[0]/10)*10;
  const hi=o.max!==undefined?o.max:Math.ceil(sorted[sorted.length-1]/10)*10;
  const n=o.bins||24, bw=(hi-lo)/n;
  const counts=new Array(n).fill(0);
  values.forEach(v=>{const i=Math.min(n-1,Math.max(0,Math.floor((v-lo)/bw)));counts[i]++});
  const peak=Math.max(...counts)||1;
  const sx=v=>M.l+((v-lo)/(hi-lo))*(W-M.l-M.r);
  const sy=c=>H-M.b-(c/peak)*(H-M.t-M.b);
  const svg=svgBox(host,W,H);
  for(let i=0;i<=4;i++){const y=M.t+(H-M.t-M.b)*i/4;
    svg.append(mkS('line',{x1:M.l,x2:W-M.r,y1:y,y2:y,class:'ax'}));
    axisLabel(svg,M.l-6,y+3,Math.round(peak*(1-i/4)),'end');}
  counts.forEach((c,i)=>{
    if(!c)return;
    const x=sx(lo+i*bw), w=Math.max(1,sx(lo+(i+1)*bw)-x-1);
    const r=mkS('rect',{x,y:sy(c),width:w,height:H-M.b-sy(c),
      fill:'var(--accent)','fill-opacity':.5});
    const ttl=mkS('title'); ttl.textContent=`${Math.round(lo+i*bw)}-${Math.round(lo+(i+1)*bw)}: ${c}`;
    r.append(ttl); svg.append(r);
  });
  for(let i=0;i<=5;i++){const v=lo+(hi-lo)*i/5; axisLabel(svg,sx(v),H-M.b+14,Math.round(v));}
  (o.marks||[]).forEach(m=>{
    const x=sx(m.v);
    svg.append(mkS('line',{x1:x,x2:x,y1:M.t,y2:H-M.b,
      stroke:m.color||'var(--text)','stroke-width':m.w||1.5,
      'stroke-dasharray':m.dash||'4 3','stroke-opacity':.85}));
    const t=axisLabel(svg,x,M.t-1,m.label,'middle');
    t.setAttribute('fill',m.color||'var(--text)');
  });
  if(o.diag){
    const a=Math.max(x0,y0), b=Math.min(x1,y1);
    svg.append(mkS('line',{x1:sx(a),y1:sy(a),x2:sx(b),y2:sy(b),class:'ref'}));
  }
  (o.labels||[]).forEach(L=>{
    // a label near the right edge has to read inward or it runs off the card
    const px=sx(L.x), flip=px>W*0.6;
    const t=mkS('text',{x:px+(flip?-7:7),y:sy(L.y)-6,class:'dlbl'});
    if(flip) t.setAttribute('text-anchor','end');
    t.textContent=L.text; svg.append(t);
  });
  if(o.xl)axisLabel(svg,W/2,H-4,o.xl);
  if(o.yl)axisLabel(svg,13,H/2,o.yl,'middle',-90);
}

/* A continuous function plotted over a domain, with optional guide points. */
function curve(host,fn,o){
  o=o||{};
  const W=o.w||560,H=o.h||280,M={t:14,r:16,b:38,l:46};
  const [x0,x1]=o.domain,[y0,y1]=o.range||[0,1];
  const sx=v=>M.l+((v-x0)/(x1-x0))*(W-M.l-M.r);
  const sy=v=>H-M.b-((v-y0)/(y1-y0))*(H-M.t-M.b);
  const svg=svgBox(host,W,H);
  for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4;
    svg.append(mkS('line',{x1:M.l,x2:W-M.r,y1:sy(v),y2:sy(v),class:'ax'}));
    axisLabel(svg,M.l-6,sy(v)+3,o.yfmt?o.yfmt(v):v.toFixed(2),'end');}
  for(let i=0;i<=6;i++){const v=x0+(x1-x0)*i/6; axisLabel(svg,sx(v),H-M.b+14,Math.round(v));}
  if(o.hline!==undefined)
    svg.append(mkS('line',{x1:M.l,x2:W-M.r,y1:sy(o.hline),y2:sy(o.hline),class:'ref'}));
  if(o.vline!==undefined)
    svg.append(mkS('line',{x1:sx(o.vline),x2:sx(o.vline),y1:M.t,y2:H-M.b,class:'ref'}));
  (o.bands||[]).forEach(b=>{
    svg.append(mkS('rect',{x:sx(b.from),y:M.t,width:sx(b.to)-sx(b.from),height:H-M.t-M.b,
      fill:b.color||'var(--accent)','fill-opacity':b.opacity||.08}));
  });
  const pts=[];
  for(let i=0;i<=160;i++){const x=x0+(x1-x0)*i/160; pts.push(`${sx(x)},${sy(fn(x))}`)}
  svg.append(mkS('polyline',{points:pts.join(' '),fill:'none',
    stroke:'var(--accent)','stroke-width':2.5}));
  (o.marks||[]).forEach(m=>{
    const cx=sx(m.x),cy=sy(m.y);
    svg.append(mkS('circle',{cx,cy,r:4,fill:'var(--accent)'}));
    const t=axisLabel(svg,cx+7,cy-6,m.label,'start'); t.setAttribute('fill','var(--text)');
  });
  if(o.diag){
    const a=Math.max(x0,y0), b=Math.min(x1,y1);
    svg.append(mkS('line',{x1:sx(a),y1:sy(a),x2:sx(b),y2:sy(b),class:'ref'}));
  }
  (o.labels||[]).forEach(L=>{
    // a label near the right edge has to read inward or it runs off the card
    const px=sx(L.x), flip=px>W*0.6;
    const t=mkS('text',{x:px+(flip?-7:7),y:sy(L.y)-6,class:'dlbl'});
    if(flip) t.setAttribute('text-anchor','end');
    t.textContent=L.text; svg.append(t);
  });
  if(o.xl)axisLabel(svg,W/2,H-4,o.xl);
  if(o.yl)axisLabel(svg,13,H/2,o.yl,'middle',-90);
}

/* Reliability diagram: predicted probability vs observed rate, dot area ~ n. */
function reliability(host,bins,o){
  o=o||{};
  const W=o.w||560,H=o.h||300,M={t:14,r:16,b:38,l:46};
  const sx=v=>M.l+v*(W-M.l-M.r), sy=v=>H-M.b-v*(H-M.t-M.b);
  const svg=svgBox(host,W,H);
  for(let i=0;i<=4;i++){const v=i/4;
    svg.append(mkS('line',{x1:M.l,x2:W-M.r,y1:sy(v),y2:sy(v),class:'ax'}));
    axisLabel(svg,M.l-6,sy(v)+3,v.toFixed(2),'end');
    axisLabel(svg,sx(v),H-M.b+14,v.toFixed(2));}
  svg.append(mkS('line',{x1:sx(0),y1:sy(0),x2:sx(1),y2:sy(1),class:'ref'}));
  const maxN=Math.max(...bins.map(b=>b.n))||1;
  bins.forEach(b=>{
    const r=4+10*Math.sqrt(b.n/maxN);
    const c=mkS('circle',{cx:sx(b.pred),cy:sy(b.act),r,
      fill:b.act>=b.pred?'var(--win)':'var(--loss)','fill-opacity':.75});
    const t=mkS('title');
    t.textContent=`predicted ${(b.pred*100).toFixed(0)}%, actual ${(b.act*100).toFixed(0)}% (n=${b.n})`;
    c.append(t); svg.append(c);
  });
  if(o.diag){
    const a=Math.max(x0,y0), b=Math.min(x1,y1);
    svg.append(mkS('line',{x1:sx(a),y1:sy(a),x2:sx(b),y2:sy(b),class:'ref'}));
  }
  (o.labels||[]).forEach(L=>{
    // a label near the right edge has to read inward or it runs off the card
    const px=sx(L.x), flip=px>W*0.6;
    const t=mkS('text',{x:px+(flip?-7:7),y:sy(L.y)-6,class:'dlbl'});
    if(flip) t.setAttribute('text-anchor','end');
    t.textContent=L.text; svg.append(t);
  });
  if(o.xl)axisLabel(svg,W/2,H-4,o.xl);
  if(o.yl)axisLabel(svg,13,H/2,o.yl,'middle',-90);
}

/* Scatter with an optional binned trend line through it. */
function scatterTrend(host,pts,o){
  o=o||{}; if(!pts.length){host.append(el('div','empty','No data yet.'));return}
  const W=o.w||560,H=o.h||300,M={t:14,r:16,b:38,l:48};
  const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
  const x0=o.x0!==undefined?o.x0:Math.min(...xs), x1=o.x1!==undefined?o.x1:Math.max(...xs);
  const y0=o.y0!==undefined?o.y0:0, y1=o.y1!==undefined?o.y1:Math.max(...ys)*1.05;
  const sx=v=>M.l+((v-x0)/(x1-x0||1))*(W-M.l-M.r);
  const sy=v=>H-M.b-((v-y0)/(y1-y0||1))*(H-M.t-M.b);
  const svg=svgBox(host,W,H);
  for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4;
    svg.append(mkS('line',{x1:M.l,x2:W-M.r,y1:sy(v),y2:sy(v),class:'ax'}));
    axisLabel(svg,M.l-6,sy(v)+3,Math.round(v),'end');}
  for(let i=0;i<=6;i++){const v=x0+(x1-x0)*i/6; axisLabel(svg,sx(v),H-M.b+14,Math.round(v));}
  const dots=[];
  pts.forEach(p=>{
    const c=mkS('circle',{cx:sx(p.x),cy:sy(p.y),r:p.r||2.6,
      fill:p.hot?'var(--accent)':'var(--muted)','fill-opacity':p.hot?.95:.4});
    if(p.tip&&!o.onPick){const t=mkS('title');t.textContent=p.tip;c.append(t)}
    svg.append(c); dots.push(c);
  });
  if(o.trendBins){
    const nb=o.trendBins, step=(x1-x0)/nb, acc=[];
    for(let i=0;i<nb;i++){
      const lo=x0+i*step, hi=lo+step;
      const inb=pts.filter(p=>p.x>=lo&&p.x<hi).map(p=>p.y);
      if(inb.length>=3) acc.push([lo+step/2, inb.reduce((a,b)=>a+b,0)/inb.length]);
    }
    if(acc.length>1)
      svg.append(mkS('polyline',{points:acc.map(a=>`${sx(a[0])},${sy(a[1])}`).join(' '),
        fill:'none',stroke:'var(--accent)','stroke-width':2.5}));
  }
  if(o.diag){
    const a=Math.max(x0,y0), b=Math.min(x1,y1);
    svg.append(mkS('line',{x1:sx(a),y1:sy(a),x2:sx(b),y2:sy(b),class:'ref'}));
  }
  (o.labels||[]).forEach(L=>{
    // a label near the right edge has to read inward or it runs off the card
    const px=sx(L.x), flip=px>W*0.6;
    const t=mkS('text',{x:px+(flip?-7:7),y:sy(L.y)-6,class:'dlbl'});
    if(flip) t.setAttribute('text-anchor','end');
    t.textContent=L.text; svg.append(t);
  });
  if(o.xl)axisLabel(svg,W/2,H-4,o.xl);
  if(o.yl)axisLabel(svg,13,H/2,o.yl,'middle',-90);

  /* Picking. A 3px dot is not a tap target and <title> does nothing at all on
     a touch screen, so instead of per-dot hit areas the whole plot listens and
     resolves to the NEAREST point. That also settles the overlap: 90 starters
     in one box means dots sit on top of each other, and "closest to my finger"
     is the only rule that behaves the way people expect. */
  if(o.onPick){
    const ring=mkS('circle',{r:8,fill:'none',stroke:'var(--text)',
      'stroke-width':2,opacity:0,'pointer-events':'none'});
    svg.append(ring);
    let cur=-1;
    const select=i=>{
      if(i<0||i>=pts.length||i===cur) return;
      if(cur>=0&&dots[cur]) dots[cur].setAttribute('fill-opacity',pts[cur].hot?.95:.4);
      cur=i; const p=pts[i];
      dots[i].setAttribute('fill-opacity',1);
      ring.setAttribute('cx',sx(p.x)); ring.setAttribute('cy',sy(p.y));
      ring.setAttribute('opacity',1);
      o.onPick(p,i);
    };
    const nearest=ev=>{
      const r=svg.getBoundingClientRect();
      if(!r.width) return -1;
      const vx=(ev.clientX-r.left)/r.width*W, vy=(ev.clientY-r.top)/r.height*H;
      let best=-1,bd=Infinity;
      pts.forEach((p,i)=>{const dx=sx(p.x)-vx,dy=sy(p.y)-vy,d=dx*dx+dy*dy;
        if(d<bd){bd=d;best=i}});
      return best;
    };
    const hit=mkS('rect',{x:0,y:0,width:W,height:H,fill:'transparent'});
    hit.style.cursor='pointer';
    svg.append(hit);
    hit.addEventListener('click',ev=>{const [i,p]=nearest(ev);select(i,p)});
    hit.addEventListener('pointermove',ev=>{
      if(ev.pointerType==='mouse') select(nearest(ev));
    });
    // keyboard: walk the points left to right
    svg.setAttribute('tabindex','0');
    svg.setAttribute('role','application');
    if(o.ariaLabel) svg.setAttribute('aria-label',o.ariaLabel);
    const order=pts.map((p,i)=>i).sort((a,b)=>pts[a].x-pts[b].x);
    svg.addEventListener('keydown',ev=>{
      const at=Math.max(0,order.indexOf(cur));
      if(ev.key==='ArrowRight'||ev.key==='ArrowDown'){
        select(order[Math.min(order.length-1,at+1)]); ev.preventDefault();
      }else if(ev.key==='ArrowLeft'||ev.key==='ArrowUp'){
        select(order[Math.max(0,at-1)]); ev.preventDefault();
      }
    });
    if(o.pickFirst!==false) select(o.pickIndex!==undefined?o.pickIndex:order[order.length-1]);
  }
}

/* Horizontal bars keyed by name. The league has ten managers and names of very
   uneven length, so the category axis is a left gutter of real text rather than
   rotated tick labels - on a phone a rotated name is unreadable. */
function barsH(host,rows,o){
  o=o||{}; if(!rows.length){host.append(el('div','empty','No data yet.'));return}
  const gut=o.gutter||96, rh=o.rowH||26, pad=o.valPad||46;
  const W=o.w||560, H=rows.length*rh+40;
  const vals=rows.map(r=>r.value);
  const x1=o.max!==undefined?o.max:Math.max(...vals,0)*1.02||1;
  const x0=Math.min(0,...vals);
  const sx=v=>gut+((v-x0)/((x1-x0)||1))*(W-gut-pad);
  const svg=svgBox(host,W,H);
  const zero=sx(0);
  rows.forEach((r,i)=>{
    const y=18+i*rh;
    const w=Math.max(1,Math.abs(sx(r.value)-zero));
    const x=r.value<0?sx(r.value):zero;
    const bar=mkS('rect',{x:x,y:y,width:w,height:rh-9,rx:1,
      fill:r.color||(r.hot?'var(--accent)':'var(--muted)'),
      'fill-opacity':r.hot?.92:.55});
    if(r.tip){const t=mkS('title');t.textContent=r.tip;bar.append(t)}
    svg.append(bar);
    // an inner segment from zero: the part of the bar that is a different thing
    if(r.value2!==undefined&&r.value2!==null&&r.value2>0){
      const w2=Math.max(1,sx(Math.min(r.value2,r.value))-zero);
      const b2=mkS('rect',{x:zero,y:y+2,width:w2,height:rh-13,rx:1,
        fill:r.color2||'var(--loss)','fill-opacity':.95});
      if(r.tip2){const t=mkS('title');t.textContent=r.tip2;b2.append(t)}
      svg.append(b2);
    }
    axisLabel(svg,gut-8,y+rh/2-1,r.label,'end');
    const vt=mkS('text',{x:x+w+6,y:y+rh/2-1,class:'dlbl'});
    vt.textContent=o.vfmt?o.vfmt(r.value):r.value;
    svg.append(vt);
  });
  if(o.ref!==undefined&&o.ref!==null){
    const rx=sx(o.ref);
    svg.append(mkS('line',{x1:rx,x2:rx,y1:10,y2:H-20,class:'ref'}));
    if(o.refLabel) axisLabel(svg,rx,8,o.refLabel);
  }
  if(o.xl) axisLabel(svg,gut+(W-gut-pad)/2,H-2,o.xl);
}

/* Rank over time. Ten lines in one box cannot each get their own colour without
   turning into a dog's breakfast, and this page's palette is deliberately small,
   so every line is muted and the SELECTED one is drawn in accent on top. Names
   sit at the right edge where the eye ends up, not in a legend. Rank 1 is at the
   top, which is the only orientation anyone reads a power ranking in. */
function bump(host,series,o){
  o=o||{};
  if(!series.length){host.append(el('div','empty','No data yet.'));return}
  const rightPad=o.rightPad||78, W=o.w||560;
  const M={t:16,r:rightPad,b:34,l:30};
  const n=series.length;
  const H=o.h||Math.max(190, n*20+M.t+M.b);
  const weeks=[...new Set(series.flatMap(s=>s.points.map(p=>p.x)))].sort((a,b)=>a-b);
  const wlo=weeks[0], whi=weeks[weeks.length-1];
  const single=wlo===whi;
  const sx=v=>single?M.l+(W-M.l-M.r)*0.82
                    :M.l+((v-wlo)/((whi-wlo)||1))*(W-M.l-M.r);
  const sy=r=>M.t+((r-1)/((n-1)||1))*(H-M.t-M.b);
  const svg=svgBox(host,W,H);

  // rank gridlines
  for(let r=1;r<=n;r++){
    svg.append(mkS('line',{x1:M.l,x2:W-M.r,y1:sy(r),y2:sy(r),class:'ax'}));
    if(r===1||r===n||n<=10) axisLabel(svg,M.l-6,sy(r)+3,r,'end');
  }
  const xf=o.xfmt||(w=>'wk '+w);
  if(!single) weeks.forEach(w=>axisLabel(svg,sx(w),H-M.b+15,xf(w)));
  else axisLabel(svg,sx(wlo),H-M.b+15,xf(wlo));

  const lines=[], labels=[], dots=[];
  series.forEach((s,i)=>{
    const pts=s.points.slice().sort((a,b)=>a.x-b.x);
    if(pts.length>1){
      const ln=mkS('polyline',{points:pts.map(p=>`${sx(p.x)},${sy(p.y)}`).join(' '),
        fill:'none',stroke:s.color||'var(--muted)','stroke-width':1.6,
        'stroke-opacity':s.color?.45:.5,
        'stroke-linejoin':'round','pointer-events':'none'});
      svg.append(ln); lines.push(ln);
    } else lines.push(null);
    const g=[];
    pts.forEach(p=>{
      const c=mkS('circle',{cx:sx(p.x),cy:sy(p.y),r:3,fill:s.color||'var(--muted)',
        'fill-opacity':s.color?.6:.55,'pointer-events':'none'});
      svg.append(c); g.push(c);
    });
    dots.push(g);
    const last=pts[pts.length-1];
    const t=mkS('text',{x:sx(last.x)+8,y:sy(last.y)+3.5,class:'dlbl',
      'fill-opacity':.65,'pointer-events':'none'});
    if(s.color) t.setAttribute('fill',s.color);
    t.textContent=s.label; svg.append(t); labels.push(t);
  });

  let cur=-1;
  const paint=i=>{
    series.forEach((s,k)=>{
      const on=k===i, col=s.color||'var(--accent)', off=s.color||'var(--muted)';
      if(lines[k]){lines[k].setAttribute('stroke',on?col:off);
        lines[k].setAttribute('stroke-opacity',on?1:(s.color?.3:.35));
        lines[k].setAttribute('stroke-width',on?3.2:1.6);}
      dots[k].forEach(c=>{c.setAttribute('fill',on?col:off);
        c.setAttribute('fill-opacity',on?1:.4);
        c.setAttribute('r',on?4.2:3);});
      labels[k].setAttribute('fill-opacity',on?1:.5);
      labels[k].setAttribute('font-weight',on?'700':'400');
    });
  };
  // report the POINT that was picked, not just the series: clicking the draft
  // column should tell you about the draft, not about the latest week
  const select=(i,pt)=>{
    if(i<0||i>=series.length) return;
    const same=i===cur;
    cur=i; if(!same) paint(i);
    if(o.onPick){
      const pts=series[i].points;
      o.onPick(series[i], i, pt||pts[pts.length-1]);
    }
  };
  if(o.onPick){
    const nearest=ev=>{
      const r=svg.getBoundingClientRect(); if(!r.width) return [-1,null];
      const vx=(ev.clientX-r.left)/r.width*W, vy=(ev.clientY-r.top)/r.height*H;
      let best=-1,bp=null,bd=Infinity;
      series.forEach((s,i)=>s.points.forEach(p=>{
        const dx=sx(p.x)-vx, dy=sy(p.y)-vy, d=dx*dx+dy*dy;
        if(d<bd){bd=d;best=i;bp=p}}));
      return [best,bp];
    };
    const hit=mkS('rect',{x:0,y:0,width:W,height:H,fill:'transparent'});
    hit.style.cursor='pointer'; svg.append(hit);
    hit.addEventListener('click',ev=>{const [i,p]=nearest(ev);select(i,p)});
    hit.addEventListener('pointermove',ev=>{if(ev.pointerType==='mouse'){const [i,p]=nearest(ev);select(i,p)}});
    svg.setAttribute('tabindex','0'); svg.setAttribute('role','application');
    if(o.ariaLabel) svg.setAttribute('aria-label',o.ariaLabel);
    svg.addEventListener('keydown',ev=>{
      if(ev.key==='ArrowDown'||ev.key==='ArrowRight'){select(Math.min(series.length-1,cur+1));ev.preventDefault()}
      else if(ev.key==='ArrowUp'||ev.key==='ArrowLeft'){select(Math.max(0,cur-1));ev.preventDefault()}
    });
  }
  if(o.yl) axisLabel(svg,11,H/2,o.yl,'middle',-90);
  if(o.select!==undefined&&o.select>=0) select(o.select);
  return {select};
}


/* ---- team identity kit ----
   Colours and monogram per manager from data/kits.json; anyone missing gets a
   stable hash hue so a new manager is never invisible. Identity only - every
   use sits beside the name. */
const KITS=D.kits||{};
function kit(p){
  const k=KITS[p]; if(k) return k;
  let h=0; for(const ch of String(p||'')) h=(h*31+ch.charCodeAt(0))>>>0;
  return {c1:`hsl(${h%360} 45% 36%)`,c2:'#F2EFE9',mono:String(p||'??').slice(0,2).toUpperCase()};
}
function ink(hex){ // white or near-black text on a kit colour
  const m=/^#?([0-9a-f]{6})$/i.exec(hex||''); if(!m) return '#fff';
  const n=parseInt(m[1],16), r=n>>16&255,g=n>>8&255,b=n&255;
  const L=(0.2126*r+0.7152*g+0.0722*b)/255; return L>0.6?'#1A1A1A':'#FFFFFF';
}
function crest(p,cls){
  const k=kit(p);
  if(k.logo){
    const img=el('img','crest logo'+(cls?' '+cls:'')); img.src=k.logo; img.alt=''; img.loading='lazy';
    img.style.setProperty('--k1',k.c1);
    img.onerror=()=>{img.replaceWith(shield(p,cls))};
    return img;
  }
  return shield(p,cls);
}
function shield(p,cls){
  const k=kit(p);
  const svg=mkS('svg',{viewBox:'0 0 40 46',class:'crest'+(cls?' '+cls:''),'aria-hidden':'true'});
  svg.append(mkS('path',{d:'M20 2 L37 8 V24 C37 36 28 42 20 45 C12 42 3 36 3 24 V8 Z',fill:k.c1}));
  svg.append(mkS('path',{d:'M3 18 L37 8 V16 L3 26 Z',fill:k.c2,'fill-opacity':.9}));
  svg.append(mkS('path',{d:'M20 2 L37 8 V24 C37 36 28 42 20 45 C12 42 3 36 3 24 V8 Z',
    fill:'none',stroke:'rgba(0,0,0,.25)','stroke-width':1}));
  const t=mkS('text',{x:20,y:36,'text-anchor':'middle','font-size':'15',fill:ink(k.c1)});
  t.textContent=k.mono; svg.append(t);
  return svg;
}
function who(p,tm){ // crest + name (+ team) inline
  const w=el('span','who'); w.append(crest(p));
  const b=el('b',null,p); w.append(b);
  if(tm) w.append(el('span','sub',tm));
  return w;
}
/* ESPN's CDN serves headshots by player id and club marks by abbreviation.
   D/ST entries have negative ids and no face - they get the club mark. */
function headshot(pid,pro,cls,ring){
  const img=el('img',cls||'hs'); img.loading='lazy'; img.alt='';
  img.src = pid<0 ? nflUrl(pro) : `https://a.espncdn.com/i/headshots/nfl/players/full/${pid}.png`;
  if(ring) img.style.setProperty('--k1',ring);
  img.onerror=()=>{img.style.visibility='hidden'};
  return img;
}
const nflUrl=pro=>pro&&pro!=='FA'?`https://a.espncdn.com/i/teamlogos/nfl/500/${String(pro).toLowerCase()}.png`:'';
function nflMark(pro){
  if(!pro||pro==='FA') return document.createTextNode('');
  const img=el('img','mark'); img.loading='lazy'; img.alt=pro; img.src=nflUrl(pro);
  img.onerror=()=>{img.style.display='none'}; return img;
}
/* diverging cell tint: blue above, orange below, strength by |v|/max */
function tint(v,max){
  if(!max||!v) return 'var(--raised)';
  const pct=Math.round(Math.min(1,Math.abs(v)/max)*72);
  return `color-mix(in oklab,${v>0?'var(--win)':'var(--loss)'} ${pct}%,var(--surface))`;
}
const NAMES=[...new Set(D.standings.map(s=>s.p))];
const TID={}; D.standings.forEach(s=>TID[s.p]=s.tid);

/* ---- header ---- */
$('#brand').innerHTML='';
$('#brand').append(document.createTextNode(M.season+' Season '));
const sp=el('span',null,'Tracker'); $('#brand').append(sp);
$('#back').href=M.recordBook;
const F={week:'all',person:'all'};
const fw=$('#fWeek'), fp=$('#fPerson');
// Only weeks with results. Listing all 14 meant every unplayed option fell
// through to the same last-completed week, so the control appeared to do
// nothing - and it defaulted to ESPN's *active* period, which has no games yet.
const PLAYED=(M.weeksDone||[]).slice().sort((a,b)=>a-b);
fw.append(new Option('All weeks','all'));
PLAYED.forEach(i=>fw.append(new Option('Week '+i,i)));
fw.value = PLAYED.length ? String(PLAYED[PLAYED.length-1]) : 'all';
F.week = fw.value;
fp.append(new Option('All managers','all'));
[...new Set(D.standings.map(s=>s.p))].sort().forEach(p=>fp.append(new Option(p,p)));
[fw,fp].forEach(s=>s.addEventListener('change',()=>{F.week=fw.value;F.person=fp.value;render()}));

const st=$('#state'); st.textContent='';
st.append(el('span','pill'+(M.started?' live':''),
  M.started?`Week ${M.currentWeek} of ${M.regularWeeks} underway`:'Preseason \u2014 no games played'));
st.append(el('span','pill',`${M.teams} teams`));

try{window.matchMedia('(max-width:640px)').addEventListener('change',()=>render());}catch(e){}

const wkOK = w => F.week==='all' || +w===+F.week;
const perOK = p => F.person==='all' || p===F.person;

/* ---- 0. scoreboard: the week, as tiles ---- */
function h2hLine(a,b){
  const [A,B]=[a,b].sort(); const r=(D.h2h||{})[`${A}|${B}`];
  const line=el('div','sb-riv');
  if(!r||!(r.w+r.l)){ line.append(el('span',null,'First ever meeting.')); return line; }
  const aw=A===a?r.w:r.l, bw=A===a?r.l:r.w;
  const lead=aw===bw?`Series level ${aw}-${bw}`:(aw>bw?`${a} leads ${aw}-${bw}`:`${b} leads ${bw}-${aw}`);
  line.append(el('span','lead',lead));
  if(r.runN>1) line.append(document.createTextNode(` \u00b7 ${r.run} has won ${r.runN} straight`));
  if(r.last){const L=r.last;
    const other=L.winner===a?b:a;
    line.append(document.createTextNode(' \u00b7 last: '),
      el('b',null,`${L.winner} ${L.ws}\u2013${L.ls}`),
      document.createTextNode(` over ${other}, ${L.s} wk ${L.wk}${L.po?' (playoff)':''}`));}
  return line;
}
function renderScoreboard(){
  const host=$('#scoreboard'); host.textContent='';
  const played=(M.weeksDone||[]);
  let wk = F.week==='all' ? (played.length?played[played.length-1]:M.currentWeek) : +F.week;
  const games=D.schedule.filter(g=>g.wk===wk&&(perOK(g.hp)||perOK(g.ap)));
  if(!games.length) return;
  const done=games.some(g=>g.hs!=null);
  const b=card(host,{title:`Week ${wk} scoreboard`,
    scope:done?`${games.length} games \u00b7 final`:`${games.length} games \u00b7 not yet played`,
    methods:`Final scores for the week, winner ruled in the team's colour. Beneath each game: the `
      +`top scorer on the winning side, and the all-time series between the two managers - every `
      +`season since 2018, playoffs included - which is where the grudges come from.`});
  const g=el('div','sbg');
  games.forEach(m=>{
    const t=el('div','sb');
    if(m.po) t.append(el('div','sb-wk','PLAYOFF'));
    const hw=m.won==='HOME', aw=m.won==='AWAY';
    const row=(p,tm,sc,won)=>{
      const r=el('div','sb-row'+(won?' win':'')+(sc==null?' tbd':''));
      r.style.setProperty('--k1',kit(p).c1);
      r.append(crest(p));
      const w=el('div','sb-who'); w.append(el('b',null,p),el('span',null,tm||'')); r.append(w);
      r.append(el('div','sb-sc',sc==null?'\u2013':sc.toFixed(1)));
      return r;
    };
    // winner on top, the way a final is read
    const H=[m.hp,m.htm,m.hs,hw], A=[m.ap,m.atm,m.as,aw];
    const [top,bot]= aw?[A,H]:[H,A];
    t.append(row(...top),row(...bot));
    if(m.hs!=null){
      const ft=el('div','sb-ft');
      const wp=aw?m.ap:m.hp, wid=aw?m.aid:m.hid;
      const margin=Math.abs(m.hs-m.as);
      const tp=(D.gameTop||{})[`${m.wk}|${wid}`];
      ft.append(el('span','mono',`by ${margin.toFixed(1)}`));
      if(tp){ ft.append(headshot(tp.pid,tp.pro,'hs',kit(wp).c1));
        const sp=el('span'); sp.append(el('b',null,tp.n),document.createTextNode(` ${tp.pts.toFixed(1)}`)); ft.append(sp); }
      t.append(ft);
    }
    t.append(h2hLine(m.hp,m.ap));
    g.append(t);
  });
  b.append(g);
}

function renderAwards(){

  const keys=Object.keys(D.awards||{});

  let key = wk!==null ? `${M.season}|${wk}` : null;
  if(!key || !D.awards[key]) key = keys[keys.length-1];
  const list = key ? D.awards[key] : null;
  const isSample = D.sample && key === `${D.sample.season}|${D.sample.week}`;
  const shownWeek = key ? key.split('|') : null;

  const b=card(host,{
    title: shownWeek ? `Week ${shownWeek[1]} awards` : 'Weekly awards',
    scope: shownWeek ? `${shownWeek[0]} season` : `${M.season} season`,
    methods:`Handed out from the completed week only - nothing here is a prediction. `
      +`The Lucky One is the winner whose score beat the fewest other teams that week; Robbed `
      +`is the loser whose score beat the most, which is the all-play view applied to a single `
      +`week. Facepalm is a lineup decision, not a big bench: it counts only points a legal `
      +`swap would have captured - a benched player who could have filled the slot and `
      +`outscored the starter - and ranks a loss where the projected lineup would have won `
      +`above one where only hindsight would, above merely leaving points. Bust and Overachiever `
      +`compare a started player's actual score against ESPN's projection for that week. `
      +`Those projections are used here only after the fact, never to preview a matchup: `
      +`across ${C.n} past matchups the higher projected team has won just `
      +`${(C.hit*100).toFixed(1)}% of the time, with actual-minus-projected scattering by `
      +`${C.sd} points over ${C.residN} team-weeks. That is too close to a coin flip to `
      +`publish as a prediction.`});
  if(!list){
    const e=el('div','empty');
    e.innerHTML=`<b>No completed weeks yet.</b><br>Awards are handed out the morning after `
      +`each week finishes, once results are final.`;
    b.append(e); return;
  }
  if(isSample && !M.started){
    const bn=el('div','banner');
    bn.innerHTML=`<b>Sample week.</b> The ${M.season} season has not kicked off, so this shows `
      +`${D.sample.season} week ${D.sample.week} to demonstrate what lands here each week. `
      +`It will switch to live ${M.season} results automatically once week 1 is final.`;
    b.append(bn);
  }
  const HERO={mvp:1,facepalm:1,robbed:1};
  const heroes=list.filter(a=>HERO[a.k]), rest=list.filter(a=>!HERO[a.k]);

  };
  const hg=el('div','aw-hero');

    const top=el('div','top');
    if(a.pid!=null) top.append(headshot(a.pid,a.pro,'hs',a.mgr?kit(a.mgr).c1:null));
    else if(a.mgr){ const cr=crest(a.mgr); cr.style.width='52px'; cr.style.height='60px'; top.append(cr); }
    const tx=el('div'); tx.append(el('div','v',a.v),el('div','t',a.l)); top.append(tx);
    c.append(top,el('div','d',a.d),byline(a));
    hg.append(c);
  });
  b.append(hg);
  const g=el('div','aw');
  rest.forEach(a=>{
    const c=el('div','ac'); c.dataset.k=a.k;

/* ---- position strength heatmap ---- */
function renderHeat(){
  const host=$('#heat'); host.textContent='';
  const wk = F.week==='all' ? null : +F.week;
  const rows=(D.slotPts||[]).filter(r=>wk===null||r.wk===wk);
  if(!rows.length) return;
  const slots=D.slots||[];
  const per={}; const wkOf={};
  rows.forEach(r=>{const a=per[r.p]=per[r.p]||{}; a[r.slot]=(a[r.slot]||0)+r.pts;
    (wkOf[r.p]=wkOf[r.p]||new Set()).add(r.wk);});
  const mgrs=Object.keys(per).filter(perOK);
  const games=p=>wkOf[p].size||1;
  const avg={}; slots.forEach(sl=>{const v=Object.keys(per).map(p=>(per[p][sl]||0)/games(p));
    avg[sl]=v.reduce((a,b)=>a+b,0)/(v.length||1);});
  let max=0; const cell={};
  mgrs.forEach(p=>slots.forEach(sl=>{const d=(per[p][sl]||0)/games(p)-avg[sl]; cell[p+'|'+sl]=d; max=Math.max(max,Math.abs(d));}));
  const tot=p=>slots.reduce((a,sl)=>a+cell[p+'|'+sl],0);
  mgrs.sort((a,b)=>tot(b)-tot(a));
  const best=mgrs.length?{p:mgrs[0]}:null;
  let bestCell=null; mgrs.forEach(p=>slots.forEach(sl=>{const d=cell[p+'|'+sl];
    if(!bestCell||d>bestCell.d) bestCell={p,sl,d};}));
  const b=card(host,{title:'Position strength',
    scope:(wk===null?'per game, season to date':'week '+wk)+' \u00b7 '+mgrs.length+' managers',
    methods:'Points from the players STARTED in each slot, per game, minus the league average '
      +'for that slot. Blue is above the field, orange below; the deeper the tint, the further '
      +'from average. This is what each roster is actually producing where it is used - a '
      +'stud on the bench does not show here, a weak spot shows in orange every week. '
      +(bestCell?(bestCell.p+'\u2019s '+bestCell.sl+' slot is the single biggest edge in the '
        +'league at +'+bestCell.d.toFixed(1)+' a game.'):'')});
  const w=el('div','hmw'), t=el('table','hm');
  const th=el('thead'), hr=el('tr'); hr.append(el('th',null,'Manager'));
  slots.forEach(sl=>hr.append(el('th',null,sl))); hr.append(el('th',null,'Net'));
  th.append(hr); t.append(th);
  const tb=el('tbody');
  mgrs.forEach(p=>{
    const tr=el('tr'); const td0=el('td'); td0.append(who(p)); tr.append(td0);
    slots.forEach(sl=>{const d=cell[p+'|'+sl]; const td=el('td',Math.abs(d)/max>.5?'hi':'');
      td.style.background=tint(d,max); td.textContent=(d>=0?'+':'')+d.toFixed(1);
      td.title=p+' '+sl+': '+((per[p][sl]||0)/games(p)).toFixed(1)+' a game vs '+avg[sl].toFixed(1); tr.append(td);});
    const n=tot(p); const tdn=el('td','hi'); tdn.textContent=(n>=0?'+':'')+n.toFixed(1);
    tdn.style.background=tint(n,Math.max(...mgrs.map(q=>Math.abs(tot(q))))||1); tr.append(tdn);
    tb.append(tr);
  });
  t.append(tb);
  const tf=el('tfoot'), fr=el('tr'); fr.append(el('td','cap','league avg'));
  slots.forEach(sl=>fr.append(el('td',null,avg[sl].toFixed(1)))); fr.append(el('td'));
  tf.append(fr); t.append(tf);
  w.append(t); b.append(w);
}

/* ---- schedule swap matrix ---- */
function renderSwap(){
  const host=$('#swap'); host.textContent='';
  const games=D.schedule.filter(g=>g.hs!=null&&!g.po);
  if(!games.length) return;
  // score and opponent by (manager, week)
  const sc={}, op={};
  games.forEach(g=>{sc[g.hp+'|'+g.wk]=g.hs; sc[g.ap+'|'+g.wk]=g.as; op[g.hp+'|'+g.wk]=g.ap; op[g.ap+'|'+g.wk]=g.hp;});
  const weeks=[...new Set(games.map(g=>g.wk))];
  const mgrs=NAMES.filter(p=>weeks.some(w=>sc[p+'|'+w]!=null));
  const rec=(r,c)=>{ // r's scores against c's schedule
    let w=0,l=0;
    weeks.forEach(wk=>{const mine=sc[r+'|'+wk]; if(mine==null) return;
      let o=op[c+'|'+wk]; if(o==null) return; if(o===r) o=c;
      const theirs=sc[o+'|'+wk]; if(theirs==null) return;
      if(mine>theirs) w++; else if(mine<theirs) l++;});
    return [w,l];
  };
  const cell={}; let max=0;
  mgrs.forEach(r=>{const [aw]=rec(r,r); mgrs.forEach(c=>{const [w,l]=rec(r,c); cell[r+'|'+c]={w,l,d:w-aw}; max=Math.max(max,Math.abs(w-aw));});});
  const shown=mgrs.filter(perOK);
  // who gains most from someone else's slate, for the footnote
  let gain=null, lose=null;
  mgrs.forEach(r=>mgrs.forEach(c=>{if(r===c) return; const x=cell[r+'|'+c];
    if(!gain||x.d>gain.d) gain={r,c,...x}; if(!lose||x.d<lose.d) lose={r,c,...x};}));
  const b=card(host,{title:'Schedule swap',scope:weeks.length+' week'+(weeks.length===1?'':'s')+' \u00b7 regular season',
    methods:'Each row is a manager\u2019s actual weekly scores; each column is whose schedule '
      +'they are played against. The cell is the record that would have resulted. The diagonal '
      +'is the real record. Blue is better than what actually happened, orange worse. When the '
      +'borrowed schedule would have them playing themselves, they play the schedule\u2019s owner '
      +'instead. '
      +(gain&&gain.d>0?(gain.r+' would be '+gain.w+'-'+gain.l+' on '+gain.c+'\u2019s slate. '):'')
      +(lose&&lose.d<0?(lose.r+' would be '+lose.w+'-'+lose.l+' on '+lose.c+'\u2019s.'):'')});
  const w=el('div','hmw'), t=el('table','hm');
  const th=el('thead'), hr=el('tr'); const c0=el('th',null,'scores \u2193 / schedule \u2192'); hr.append(c0);
  mgrs.forEach(c=>{const h=el('th'); h.append(crest(c)); h.append(document.createTextNode(' '+c)); hr.append(h);});
  th.append(hr); t.append(th);
  const tb=el('tbody');
  shown.forEach(r=>{
    const tr=el('tr'); const td0=el('td'); td0.append(who(r)); tr.append(td0);
    mgrs.forEach(c=>{const x=cell[r+'|'+c]; const td=el('td',r===c?'self':(Math.abs(x.d)/(max||1)>.5?'hi':''));
      if(r!==c) td.style.background=tint(x.d,max);
      td.textContent=x.w+'-'+x.l; td.title=r+' on '+c+'\u2019s schedule: '+x.w+'-'+x.l+(x.d?(' ('+(x.d>0?'+':'')+x.d+')'):''); tr.append(td);});
    tb.append(tr);
  });
  t.append(tb); w.append(t); b.append(w);
}

/* ---- trophy case: the weekly awards, tallied ---- */
function renderTrophy(){
  const host=$('#trophy'); host.textContent='';
  const keys=Object.keys(D.awards||{}).filter(k=>k.startsWith(M.season+'|'));
  if(!keys.length) return;
  const KINDS=[['mvp','MVP',1],['high','High score',1],['blowout','Beating',1],['sleeper','Overachiever',1],
    ['nail','Nail-biter',1],['lucky','Lucky',0],['robbed','Robbed',0],['benchhero','Bench hero',0],
    ['facepalm','Facepalm',-1],['bust','Bust',-1],['low','Low score',-1]];
  const tally={};
  keys.forEach(k=>D.awards[k].forEach(a=>{if(!a.mgr) return; const t=tally[a.mgr]=tally[a.mgr]||{};
    t[a.k]=(t[a.k]||0)+1;}));
  const rows=NAMES.filter(perOK).map(p=>{const t=tally[p]||{};
    const good=KINDS.filter(k=>k[2]>0).reduce((a,k)=>a+(t[k[0]]||0),0);
    const bad=KINDS.filter(k=>k[2]<0).reduce((a,k)=>a+(t[k[0]]||0),0);
    return {p,t,good,bad,net:good-bad};});
  const b=card(host,{title:'Trophy case',scope:keys.length+' week'+(keys.length===1?'':'s')+' of awards',
    methods:'Every weekly award, counted per manager across the season. Cups are the ones you '
      +'want; the orange marks are the ones you do not. Lucky, Robbed and Bench hero are '
      +'neither - they happen to you. Sorted by cups minus marks.'});
  const cups=(n,cls)=>{const s=el('span'); for(let i=0;i<n;i++) s.append(el('span','cup'+(cls?' '+cls:''),cls==='bad'?'\u25cf':'\u2605'));
    if(!n) s.append(el('span','cup dim','\u00b7')); return s;};
  const cols=[{h:'Manager',n:false,v:r=>r.p,f:r=>who(r.p)}];
  KINDS.forEach(([k,l,sgn])=>cols.push({h:l,n:false,v:r=>r.t[k]||0,
    f:r=>cups(r.t[k]||0,sgn<0?'bad':(sgn===0?'dim':''))}));
  cols.push({h:'Net',v:r=>r.net,f:r=>(r.net>0?'+':'')+r.net,cls:r=>r.net>0?'pos':(r.net<0?'neg':'')});
  b.classList.add('trophy');
  table(b,cols,rows,{sort:cols.length-1});
}

/* ---- power rankings ---- */
function renderPower(){
  const host=$('#power'); host.textContent='';
  const all=D.power||[];
  if(!all.length) return;
  const latest=all[all.length-1];
  const shown=latest[0].week;
  const wres=Math.round(latest[0].wResults*100);
  const nar=NARROW();

  const b=cardPad(host,{
    title:'Power rankings',
    scope:`through week ${shown}`,
    methods:`Rank over the season, 1 at the top. What a roster can do, how much of it the `
      +`manager actually captures, and what it projects to do from here. Points scored is not `
      +`a separate ingredient because it is already the first two multiplied together - `
      +`counting it again would count it twice. Strength is the best lineup the roster could `
      +`legally have started, so depth counts without a deep bench being treated as a mistake. `
      +`Captured is what was actually started over that best legal lineup, which is the only `
      +`fair way to charge someone for a bad call: you cannot start everyone, so only points `
      +`you could have started are held against you. Outlook is the best legal lineup by `
      +`ESPN's remaining-season projection - the same source this page distrusts for picking a `
      +`single winner, which is why it is labelled and capped rather than hidden. Results `
      +`count ${wres}% this week and climb as the season gives them more to stand on, with a `
      +`four-week recency half-life. The draft column is the season-start ranking: the `
      +`roster each manager walked out of the draft with, scored on preseason `
      +`projections alone, since nothing had been played yet. It is what week 1 moves `
      +`against.`});

  // one series per manager, rank by week
  const byMgr={};
  all.forEach(wkRows=>wkRows.forEach(r=>{
    (byMgr[r.p]=byMgr[r.p]||[]).push({x:r.week,y:r.rank,row:r});
  }));
  const series=Object.keys(byMgr)
    .map(p=>({label:p,points:byMgr[p],color:kit(p).c1}))
    .sort((a,b)=>a.points[a.points.length-1].y-b.points[b.points.length-1].y);

  const read=el('div','pick');
  const dflt = nar ? 'Tap any line for the detail.'
                   : 'Hover or click any line; arrow keys work too.';
  const show=(sv,i,pt)=>{
    read.textContent='';
    if(!sv){read.append(el('span','pick-hint',dflt));return}
    const r=(pt||sv.points[sv.points.length-1]).row;
    const mvTxt = r.move===null||r.move===undefined ? 'new'
      : (r.move===0?'held':(r.move>0?`up ${r.move}`:`down ${-r.move}`));
    read.append(el('b',null,`${r.rank}. ${r.p}`),
      el('span','pick-meta',` ${r.week===0?'at the draft':'week '+r.week} \u00b7 rating `),
      el('span','pick-num',`${r.rating}`),
      el('span','pick-meta',` \u00b7 ${mvTxt}`));
    // week 0 is the drafted roster - it has no results to report
    if(r.strength!=null) read.append(
      el('span','pick-meta',` \u00b7 strength `), el('span','pick-num',`${r.strength}`));
    if(r.eff!=null) read.append(
      el('span','pick-meta',` \u00b7 captured `),
      el('span','pick-num'+(r.eff>=85?' up':' dn'),`${r.eff.toFixed(1)}%`));
    if(r.look!=null) read.append(
      el('span','pick-meta',` \u00b7 outlook `), el('span','pick-num',`${r.look.toFixed(0)}`));
  };
  show(null);

  // if a manager is filtered, open on them
  const pre = F.person==='all' ? -1 : series.findIndex(sv=>sv.label===F.person);
  bump(b,series,{
    w: nar?360:560, rightPad: nar?66:78,
    yl:'Rank', onPick:show, select:pre, xfmt:w=>w===0?'draft':'wk '+w,
    ariaLabel:'Power ranking position by week. Arrow keys step through managers.'});
  b.append(read);
}

/* ---- charts ----
   These are about the league: who scored what, who sat what, which players
   beat their number. The distribution/calibration plots that used to live here
   were left over from the pregame previews and described the method, not the
   season. The one number worth keeping from them is quoted in the footnotes. */
const NARROW=()=>window.matchMedia('(max-width:640px)').matches;
function renderCharts(){
  const host=$('#charts'); host.textContent='';
  const cols=el('div','cols'); host.append(cols);
  // A 560-wide viewBox scaled into a ~317px phone column shrinks every label to
  // about 6px. Draw a narrower box on small screens so the type lands near 1:1.
  const nar=NARROW();
  const BAR=nar?{w:360,gutter:74,rowH:28,valPad:50}:{};
  const SCT=nar?{w:360,h:300}:{};
  const wk = F.week==='all' ? null : +F.week;
  const wkLabel = wk===null ? 'the season so far' : ('week '+wk);

  /* -- 1. the week, manager by manager -- */
  const games=D.schedule.filter(g=>g.hs!=null&&(wk===null||g.wk===wk));
  const tally={};
  games.forEach(g=>{
    tally[g.hp]=(tally[g.hp]||0)+g.hs;
    tally[g.ap]=(tally[g.ap]||0)+g.as;
  });
  const scored=Object.entries(tally).map(([p,v])=>({label:p,value:Math.round(v*10)/10}))
    .sort((a,b)=>b.value-a.value);
  if(scored.length){
    const avg=scored.reduce((a,b)=>a+b.value,0)/scored.length;
    const top=scored[0], bot=scored[scored.length-1];
    scored.forEach(r=>{r.hot=true; r.color=kit(r.label).c1;
      r.tip = r.label+' '+r.value.toFixed(1);});
    const c1=el('div'); cols.append(c1);
    const b1=cardPad(c1,{
      title:'Who scored what',
      scope:(wk===null?('weeks '+(M.weeksDone||[]).join(', ')):('week '+wk))
            +', '+scored.length+' managers',
      methods:'Points scored in '+wkLabel+', highest to lowest. The dashed line is the '
        +'league average of '+avg.toFixed(1)+'. '+top.label+' led with '+top.value.toFixed(1)
        +' and '+bot.label+' brought up the rear on '+bot.value.toFixed(1)+' - a spread of '
        +(top.value-bot.value).toFixed(1)+' points between the best and worst nights.'});
    barsH(b1,scored,Object.assign({ref:avg,refLabel:'avg '+avg.toFixed(0),
      vfmt:v=>v.toFixed(1),xl:'Points scored'},BAR));
  }

  /* -- 2. regret: what lineup decisions cost, legal swaps only -- */
  const decs=(D.decisions||[]).filter(d=>wk===null||d.wk===wk);
  const agg={};
  decs.forEach(d=>{const a=agg[d.p]=agg[d.p]||{regret:0,chalk:0,worst:null};
    a.regret+=d.regret; if(d.chalk!=null&&d.chalk>0) a.chalk+=d.chalk;
    if(d.swap&&(!a.worst||d.swap.d>a.worst.d)) a.worst={...d.swap,wk:d.wk};});
  const reg=Object.entries(agg).map(([p,a])=>({label:p,value:Math.round(a.regret*10)/10,
      value2:Math.round(a.chalk*10)/10,color:kit(p).c1,color2:'var(--loss)',hot:true,
      tip:p+': '+a.regret.toFixed(1)+' available through legal swaps',
      tip2:p+': '+a.chalk.toFixed(1)+' of it by just starting the projected lineup',
      worst:a.worst}))
    .sort((a,b)=>b.value-a.value);
  if(reg.length){
    const worst=reg[0]; const ravg=reg.reduce((a,b)=>a+b.value,0)/reg.length;
    const chalky=[...reg].sort((a,b)=>b.value2-a.value2)[0];
    const c2=el('div'); cols.append(c2);
    const sw=worst.worst;
    const b2=cardPad(c2,{
      title:'Regret tracker',
      scope:wk===null?'season to date':('week '+wk),
      methods:'Points a LEGAL swap would have captured: a benched player who could have filled '
        +'a starter\u2019s slot and outscored him, summed per manager against the best lineup '
        +'hindsight allows. Bench points that could not have been started are not counted, '
        +'so a deep roster is not a mistake. The orange inner bar is the inexcusable part - '
        +'what simply starting ESPN\u2019s projected lineup would have gained. '
        +worst.label+' leads with '+worst.value.toFixed(1)
        +(sw?(' (worst call: '+sw.in+' sat for '+sw.inPts.toFixed(1)+' while '+sw.out+' started at '
          +sw.slot+' for '+sw.outPts.toFixed(1)+(sw.chalk?', and ESPN had him higher':'')+')'):'')
        +'; league average '+ravg.toFixed(1)+'.'
        +(chalky&&chalky.value2>0?' '+chalky.label+' ignored the projection to the tune of '
          +chalky.value2.toFixed(1)+'.':'')});
    barsH(b2,reg,Object.assign({ref:ravg,refLabel:'avg '+ravg.toFixed(0),
      vfmt:v=>v.toFixed(1),xl:'Points left by legal swaps'},BAR));
    const lg=el('div','legend'); lg.style.padding='8px 0 0';
    const i1=el('i'); i1.style.background='var(--muted)'; i1.style.opacity='.55';
    const i2=el('i'); i2.style.background='var(--loss)';
    lg.append(i1,el('span',null,'hindsight'),i2,el('span',null,'projection said so'));
    b2.append(lg);
  }

  /* -- 3. every starter against their projection -- */
  const pts=[], diffs=[];
  D.rosters.forEach(r=>{
    (r.players||[]).forEach(pl=>{
      if(!pl.st||pl.act==null||pl.proj==null) return;
      const d=pl.act-pl.proj;
      pts.push({x:pl.proj,y:pl.act,r:3,hot:Math.abs(d)>=14,
        name:pl.n,pos:pl.pos,mgr:r.p});
      diffs.push({n:pl.n,p:r.p,d:d,x:pl.proj,y:pl.act});
    });
  });
  if(pts.length){
    diffs.sort((a,b)=>b.d-a.d);
    const over=diffs[0], under=diffs[diffs.length-1];
    const beat=diffs.filter(d=>d.d>0).length;
    const c3=el('div'); cols.append(c3);
    const b3=cardPad(c3,{
      title:'Every starter against their projection',
      scope:pts.length+' started players, '+wkLabel,
      methods:'Each dot is one started player: ESPN\u2019s projection across, what they actually '
        +'scored up. The dashed diagonal is the projection exactly met - above it beat the '
        +'number, below it missed. '+beat+' of '+pts.length+' starters ('
        +(beat/pts.length*100).toFixed(0)+'%) came in over. Best of the week was '+over.n
        +' for '+over.p+' at '+over.d.toFixed(1)+' over; worst was '+under.n+' for '+under.p
        +' at '+under.d.toFixed(1)+'.'});
    const pick=el('div','pick');
    const dflt=nar?'Tap any dot for the player.':'Hover or click any dot; arrow keys work too.';
    const show=pl=>{
      pick.textContent='';
      if(!pl){pick.append(el('span','pick-hint',dflt));return}
      const d=pl.y-pl.x, sign=d>=0?'+':'';
      // "Steelers D/ST" already carries the position - do not print it twice
      const pos = pl.name.indexOf(pl.pos)>=0 ? '' : pl.pos+' \u00b7 ';
      pick.append(el('b',null,pl.name),
        el('span','pick-meta',` ${pos}${pl.mgr}`),
        el('span','pick-num'+(d>=0?' up':' dn'),` ${pl.y.toFixed(1)}`),
        el('span','pick-meta',` actual vs ${pl.x.toFixed(1)} projected `),
        el('span','pick-num'+(d>=0?' up':' dn'),`${sign}${d.toFixed(1)}`));
    };
    show(null);
    scatterTrend(b3,pts,Object.assign({x0:0,y0:0,diag:true,
      labels:[{x:over.x,y:over.y,text:over.n},{x:under.x,y:under.y,text:under.n}],
      onPick:show, pickIndex:pts.indexOf(pts.find(q=>q.name===over.n)),
      ariaLabel:'Started players, projected against actual points. Use arrow keys to step through players.',
      xl:'Projected points',yl:'Actual points'},SCT));
    b3.append(pick);
  }

  /* -- 4. schedule luck -- */
  const luck=D.standings.filter(s=>(s.apw+s.apl)>0).map(s=>({
    label:s.p, value:Math.round(s.apw/(s.apw+s.apl)*1000)/10,
    hot:false, w:s.w, l:s.l, apw:s.apw, apl:s.apl,
    tip:s.p+': '+s.w+'-'+s.l+' real, '+s.apw+'-'+s.apl+' against the whole league'
  })).sort((a,b)=>b.value-a.value);
  if(luck.length){
    const games_ea=(D.standings[0].w+D.standings[0].l)||1;
    luck.forEach(r=>{
      const expected=r.value/100*games_ea;
      r.gap=r.w-expected;
      r.color=r.gap>=0.5?'var(--win)':(r.gap<=-0.5?'var(--loss)':'var(--muted)');
      r.hot=Math.abs(r.gap)>=0.5;
    });
    const lucky=[...luck].sort((a,b)=>b.gap-a.gap)[0];
    const robbed=[...luck].sort((a,b)=>a.gap-b.gap)[0];
    const c4=el('div'); cols.append(c4);
    const b4=cardPad(c4,{
      title:'Who the schedule has been kind to',
      scope:games_ea+' week'+(games_ea===1?'':'s')+' played',
      methods:'All-play win rate: what each manager\u2019s record would be if they played every '
        +'other team every week, which strips the schedule out. Blue means the real record is '
        +'running ahead of that, orange behind. '+lucky.label+' is the biggest beneficiary ('
        +lucky.w+'-'+lucky.l+' real against '+lucky.apw+'-'+lucky.apl+' all-play) and '
        +robbed.label+' the biggest victim ('+robbed.w+'-'+robbed.l+' against '+robbed.apw
        +'-'+robbed.apl+'). Over a full season these converge; early on they rarely do.'});
    barsH(b4,luck,Object.assign({max:100,ref:50,refLabel:'50%',
      vfmt:v=>v.toFixed(0)+'%',xl:'All-play win rate'},BAR));
  }
}

function render(){
  PLATE=0;
  renderScoreboard(); renderAwards(); renderCharts(); renderHeat(); renderStandings();
  renderSwap(); renderPower(); renderTrophy(); renderSchedule(); renderRosters();
  renderDraft(); renderForm();
}
render();
</script>
