<title>QB Plates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
__THEME__
.qb-svg{display:block;width:100%;height:auto}
.qb-svg text{font-family:'Source Sans 3',sans-serif}
.qb-ctl{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);padding:12px 20px 0}
.qb-tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);padding:6px 10px;font-size:12.5px;opacity:0;white-space:nowrap;color:var(--text)}
.qb-sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.qb-verdict{padding:14px 20px 0;font-size:14px;max-width:760px}
@media (max-width:640px){.qb-ctl,.qb-verdict{padding-left:14px;padding-right:14px}}
</style>
<script>
document.documentElement.setAttribute('data-page','season');
try{if(localStorage.getItem('ffl-theme')==='dark')
  document.documentElement.setAttribute('data-theme','dark');}catch(e){}
</script>

<header><div class="wrap">
  <div class="hbar">
    <div class="brand" id="brand"></div>
    <div class="ctl">
      <div class="theme" role="group" aria-label="Colour theme">
        <button type="button" data-t="light" aria-pressed="true">Light</button>
        <button type="button" data-t="dark" aria-pressed="false">Dark</button>
      </div>
      <a class="back" id="backS">Season tracker</a>
      <a class="back" id="backR">All-time record book</a>
    </div>
  </div>
  <div class="state" id="state"></div>
  <div style="height:10px"></div>
</div></header>

<main class="wrap"><div id="plates"></div></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script id="payload" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById('payload').textContent);
const $ = s => document.querySelector(s);
const el = (t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;
  if(x!==undefined&&x!==null)n.textContent=x;return n};

(function(){
  const root=document.documentElement;
  const btns=[...document.querySelectorAll('.theme button')];
  function apply(t,store){
    if(t==='dark') root.setAttribute('data-theme','dark');
    else root.removeAttribute('data-theme');
    btns.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.t===t)));
    if(store){ try{ localStorage.setItem('ffl-theme',t); }catch(e){} }
  }
  let cur='light';
  try{ if(localStorage.getItem('ffl-theme')==='dark') cur='dark'; }catch(e){}
  apply(cur,false);
  btns.forEach(b=>b.addEventListener('click',()=>apply(b.dataset.t,true)));
})();

$('#brand').append(document.createTextNode('QB '));
$('#brand').append(el('span',null,'Plates'));
$('#backS').href=D.meta.seasonPage; $('#backR').href=D.meta.recordBook;
$('#state').textContent='League-wide NFL quarterback charts from nflverse play-by-play. Newest plate first.';

const ROMAN=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
const sgn=(v,d)=>(v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(d);

function plate(F,idx){
  const L=F.league,[w0,w1]=F.weeks;
  const c=el('div','card'),hd=el('div','hd');
  hd.append(el('h2',null,'Plate '+ROMAN[idx]+' · '+F.title));
  hd.append(el('span','chip',F.season+' · weeks '+w0+'–'+w1));
  hd.append(el('div','sub',F.scope+' · min '+F.min+' '+F.unit+' · '+L.qbs_qualified+' QBs · '+L.plays.toLocaleString()+' plays'));
  const bd=el('div','bd flush');
  const verdict=el('div','qb-verdict');
  verdict.textContent='Only '+L.qbs_x_distinguishable+' of '+L.qbs_qualified+' QBs sit clearly off league average on '+F.x_label+
    ' (±1.96 SE). The typical QB’s '+F.x_label+' carries ±'+L.median_x_se.toFixed(2)+
    ' of noise — turn on the error bars before reading too much into a quadrant.';
  const ctl=el('div','qb-ctl');
  const seL=el('label'),se=el('input');se.type='checkbox';seL.append(se,document.createTextNode(' ±1 SE on '+F.x_label));
  const hlL=el('label',null,'Highlight '),sel=el('select');
  const teams=[...new Set(F.qbs.map(q=>q.team))].sort();
  sel.innerHTML='<option value="">none</option>'+teams.map(t=>'<option>'+t+'</option>').join('');
  hlL.append(sel);
  const k1=el('span');k1.innerHTML='<span class="qb-sw" style="background:var(--accent)"></span>highlighted team';
  const k2=el('span');k2.innerHTML='<span class="qb-sw" style="background:var(--muted);opacity:.55"></span>others · dot size = '+F.unit;
  ctl.append(seL,hlL,k1,k2);
  const wrap=el('div');wrap.style.position='relative';
  const tip=el('div','qb-tip');wrap.append(tip);
  const svgN=document.createElementNS('http://www.w3.org/2000/svg','svg');svgN.setAttribute('class','qb-svg');
  svgN.setAttribute('role','img');svgN.setAttribute('aria-label',F.title+': '+F.x_label+' versus '+F.y_label+' by quarterback');
  wrap.append(svgN);
  const ft=el('div','ft');
  ft.innerHTML='<b>Source</b> nflverse-data play_by_play_'+F.season+'.parquet (nflfastR parse of NFL GSIS), retrieved '+F.retrieved+
    '. Regular season, weeks '+w0+'–'+w1+'. '+F.x_label+' and nflfastR '+F.y_label+' averaged per passer; dashed lines = league average over all '+
    L.plays.toLocaleString()+' qualifying plays ('+F.x_label+' '+L.x.toFixed(3)+', '+F.y_label+' '+sgn(L.y,2)+'). Error bars = ±1 standard error of mean '+F.x_label+'.';
  bd.append(verdict,ctl,wrap);c.append(hd,bd,ft);

  const R=F.qbs.map(q=>({name:q.name,team:q.team,n:q.n,x:q.x,y:q.y,se:q.x_se}));
  const svg=d3.select(svgN);
  function draw(){
    const phone=matchMedia('(max-width:640px)').matches;
    const W=phone?380:920,H=phone?420:540,m={t:12,r:14,b:42,l:phone?40:50},fs=phone?10.5:12;
    svgN.setAttribute('viewBox','0 0 '+W+' '+H);svg.selectAll('*').remove();
    const xs=R.flatMap(d=>[d.x-d.se,d.x+d.se]),ys=R.map(d=>d.y);
    const px=(d3.max(xs)-d3.min(xs))*.03,py=(d3.max(ys)-d3.min(ys))*.08;
    const x=d3.scaleLinear([d3.min(xs)-px,d3.max(xs)+px],[m.l,W-m.r]).nice();
    const y=d3.scaleLinear([d3.min(ys)-py,d3.max(ys)+py],[H-m.b,m.t]).nice();
    const r=d3.scaleSqrt(d3.extent(R,d=>d.n),phone?[3,6.5]:[4,9]);
    const hl=sel.value,isH=d=>d.team===hl;
    svg.append('rect').attr('x',x(L.x)).attr('y',m.t).attr('width',W-m.r-x(L.x)).attr('height',y(L.y)-m.t).attr('style','fill:color-mix(in srgb,var(--win) 7%,transparent)');
    svg.append('rect').attr('x',m.l).attr('y',y(L.y)).attr('width',x(L.x)-m.l).attr('height',H-m.b-y(L.y)).attr('style','fill:color-mix(in srgb,var(--loss) 7%,transparent)');
    const gx=svg.append('g').attr('transform','translate(0,'+(H-m.b)+')').call(d3.axisBottom(x).ticks(phone?5:8).tickSize(-(H-m.t-m.b)).tickFormat(d=>sgn(d,1).replace('+','')));
    const gy=svg.append('g').attr('transform','translate('+m.l+',0)').call(d3.axisLeft(y).ticks(phone?6:8).tickSize(-(W-m.l-m.r)).tickFormat(d=>sgn(d,0)));
    [gx,gy].forEach(g=>{g.select('.domain').remove();g.selectAll('line').attr('style','stroke:var(--grid)');g.selectAll('text').attr('style','fill:var(--muted)').attr('font-size',fs)});
    const ref='stroke:var(--muted);stroke-opacity:.7';
    svg.append('line').attr('x1',x(L.x)).attr('x2',x(L.x)).attr('y1',m.t).attr('y2',H-m.b).attr('style',ref).attr('stroke-dasharray','6 4');
    svg.append('line').attr('x1',m.l).attr('x2',W-m.r).attr('y1',y(L.y)).attr('y2',y(L.y)).attr('style',ref).attr('stroke-dasharray','6 4');
    svg.append('text').attr('x',W-m.r-6).attr('y',m.t+15).attr('text-anchor','end').attr('style','fill:var(--muted)').attr('font-size',fs).text('above average on both');
    svg.append('text').attr('x',m.l+6).attr('y',H-m.b-8).attr('style','fill:var(--muted)').attr('font-size',fs).text('below average on both');
    svg.append('text').attr('x',(m.l+W-m.r)/2).attr('y',H-6).attr('text-anchor','middle').attr('style','fill:var(--muted)').attr('font-size',fs+1).text(F.x_label+' →');
    svg.append('text').attr('transform','translate(13,'+((m.t+H-m.b)/2)+') rotate(-90)').attr('text-anchor','middle').attr('style','fill:var(--muted)').attr('font-size',fs+1).text(F.y_label+' (pp) →');
    const D2=[...R].sort((a,b)=>isH(a)-isH(b));
    if(se.checked) svg.append('g').selectAll('line').data(D2).join('line').attr('x1',d=>x(d.x-d.se)).attr('x2',d=>x(d.x+d.se)).attr('y1',d=>y(d.y)).attr('y2',d=>y(d.y))
      .attr('style',d=>'stroke:var('+(isH(d)?'--accent':'--muted')+');stroke-opacity:'+(isH(d)?.85:.35)).attr('stroke-width',2).attr('stroke-linecap','round');
    svg.append('g').selectAll('circle').data(D2).join('circle').attr('cx',d=>x(d.x)).attr('cy',d=>y(d.y)).attr('r',d=>r(d.n))
      .attr('style',d=>'fill:var('+(isH(d)?'--accent':'--muted')+');fill-opacity:'+(isH(d)?1:.55)+';stroke:var(--surface);stroke-width:1.5')
      .on('mousemove',(e,d)=>{const b=wrap.getBoundingClientRect();tip.style.opacity=1;
        tip.innerHTML='<b>'+d.name+'</b> · '+d.team+'<br>'+F.x_label+' '+d.x.toFixed(2)+' ± '+d.se.toFixed(2)+'<br>'+F.y_label+' '+sgn(d.y,1)+' pp · '+d.n+' '+F.unit;
        let Lf=e.clientX-b.left+14;if(Lf>b.width-200)Lf-=220;tip.style.left=Lf+'px';tip.style.top=(e.clientY-b.top-12)+'px'})
      .on('mouseleave',()=>tip.style.opacity=0);
    const placed=[],out=[],cw=fs*.55;
    for(const d of [...R].sort((a,b)=>isH(b)-isH(a)||b.n-a.n)){
      const cx=x(d.x),cy=y(d.y),w=d.name.length*cw,h=fs+1,rr=r(d.n)+3;
      for(const [lx,ly,a] of [[cx+rr,cy+4,'start'],[cx-rr,cy+4,'end'],[cx,cy-rr-3,'middle'],[cx,cy+rr+fs,'middle']]){
        const x0=a==='start'?lx:a==='end'?lx-w:lx-w/2,bx=[x0,ly-h+2,x0+w,ly+2];
        if(bx[0]<m.l||bx[2]>W-m.r||bx[1]<m.t||bx[3]>H-m.b)continue;
        if(placed.some(p=>!(bx[2]<p[0]||bx[0]>p[2]||bx[3]<p[1]||bx[1]>p[3])))continue;
        if(R.some(o=>o!==d&&Math.hypot(x(o.x)-Math.max(bx[0],Math.min(x(o.x),bx[2])),y(o.y)-Math.max(bx[1],Math.min(y(o.y),bx[3])))<r(o.n)))continue;
        placed.push(bx);out.push({d,lx,ly,a});break}}
    svg.append('g').selectAll('text').data(out).join('text').attr('x',o=>o.lx).attr('y',o=>o.ly).attr('text-anchor',o=>o.a).attr('font-size',fs)
      .attr('style',o=>'fill:var('+(isH(o.d)?'--text':'--muted')+');font-weight:'+(isH(o.d)?700:400)).text(o=>o.d.name);
  }
  sel.onchange=draw;se.onchange=draw;matchMedia('(max-width:640px)').addEventListener('change',draw);draw();
  return c;
}
[...D.plates].map((F,i)=>[F,i]).reverse().forEach(([F,i])=>{$('#plates').append(plate(F,i));$('#plates').append(el('div','yard'))});
</script>
