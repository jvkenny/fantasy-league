<title>Player stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Shared stylesheet for both pages, injected at render time.
   Harpers Ferry house rules applied to a stat sheet: two typefaces, warm
   desaturated ground, colourblind-safe blue/orange diverging pair (never
   red-green on decision-critical data), white space as structure.

   LIGHT IS THE DEFAULT, deliberately - there is no prefers-color-scheme block,
   so the OS does not decide. Dark is opt-in through the header toggle, which
   stamps data-theme="dark" and remembers the choice.
   Every token below was contrast-checked to 4.5:1 on both grounds. */
:root{
  --ground:#F2EFE9;--surface:#FBFAF7;--raised:#E8E3D9;--line:#D6CFC2;
  --text:#241F1A;--muted:#61584C;--accent:#0F5C8C;--accentbg:#DCE8F1;
  --win:#00618F;--loss:#B24A00;--grid:#E4DED2;
}
:root[data-theme="dark"]{
  --ground:#191614;--surface:#221E1A;--raised:#2C2721;--line:#3A342C;
  --text:#EDE7DC;--muted:#A2988A;--accent:#7FB6DD;--accentbg:#20303C;
  --win:#56B4E9;--loss:#E69F00;--grid:#2A251F;
}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--ground);color:var(--text);
  font-family:"Source Sans 3",system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding:0 28px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
h2{font-weight:700;text-transform:uppercase;letter-spacing:.09em;font-size:15px;margin:0}
.sub{color:var(--muted);font-size:13px;margin:3px 0 0}
/* header */
header{position:sticky;top:0;z-index:20;background:var(--surface);
  border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:20px;padding:16px 0;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.13em;
  white-space:nowrap}
.brand span{color:var(--accent)}
.ctl{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap}
select,input[type=search]{font-family:inherit;font-size:14px;color:var(--text);
  background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:7px 10px}
input[type=search]{width:210px}
a.back{font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:2px;
  padding:7px 12px;white-space:nowrap}
a.back:hover{color:var(--accent);border-color:var(--accent)}
/* theme toggle */
.theme{display:inline-flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.theme button{font-family:inherit;font-weight:600;font-size:11px;text-transform:uppercase;
  letter-spacing:.09em;background:var(--surface);border:none;color:var(--muted);
  padding:7px 11px;cursor:pointer}
.theme button+button{border-left:1px solid var(--line)}
.theme button:hover{color:var(--text)}
.theme button[aria-pressed="true"]{background:var(--raised);color:var(--accent)}
nav{display:flex;gap:6px;overflow-x:auto;border-top:1px solid var(--line)}
nav button{font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.1em;
  background:none;border:none;color:var(--muted);padding:13px 4px;margin-right:18px;
  cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button:hover{color:var(--text)}
nav button[aria-current]{color:var(--text);border-bottom-color:var(--accent)}
main{padding:28px 0 80px}
.panel{display:none}.panel.on{display:block}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:2px;
  margin-bottom:24px}
.card>.hd{padding:16px 20px 14px;border-bottom:1px solid var(--line);
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.card>.bd{padding:18px 20px}.card>.bd.flush{padding:0}
.card>.ft{padding:12px 20px 14px;border-top:1px solid var(--line);font-size:12.5px;
  line-height:1.6;color:var(--muted);max-width:92ch}
.card>.ft b{font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:10.5px;
  color:var(--text);margin-right:8px}
.chip{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);
  border:1px solid var(--line);border-radius:2px;padding:2px 8px;white-space:nowrap}
.cols{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr))}
/* tables */
.tw{overflow-x:auto;max-height:620px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 14px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
thead th{position:sticky;top:0;z-index:2;background:var(--raised);font-weight:700;
  font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);cursor:pointer}
thead th:first-child{z-index:3;background:var(--raised)}
thead th:hover,thead th[data-on]{color:var(--accent)}
tbody tr:hover td,tbody tr:hover td:first-child{background:var(--raised)}
td.n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:13px}
.pos{color:var(--win)}.neg{color:var(--loss)}
.tag{font-family:"IBM Plex Mono",monospace;font-size:10px;padding:2px 6px;border-radius:2px;
  background:var(--raised);color:var(--muted);border:1px solid var(--line)}
.tag.gold{background:var(--accentbg);color:var(--accent);border-color:var(--accent)}
.bar-c{position:relative}
.bar-c i{position:absolute;left:0;top:3px;bottom:3px;background:var(--accent);opacity:.18;
  border-radius:1px}
.bar-c span{position:relative}
.matrix{overflow-x:auto}
/* charts */
svg{display:block;width:100%;height:auto;overflow:visible}
.ax{stroke:var(--grid);stroke-width:1}
.axl{fill:var(--muted);font-family:"IBM Plex Mono",monospace;font-size:9.5px}
.ref{stroke:var(--muted);stroke-dasharray:3 3;stroke-width:1;opacity:.6}
.dot{cursor:pointer}
.dot:hover circle{stroke:var(--text);stroke-width:2}
.dlbl{fill:var(--text);font-size:10.5px;font-weight:600}
.note{font-size:12px;color:var(--muted);margin-top:10px}
/* findings + weekly awards: category reads as a quiet rule underneath rather
   than a colour bar down the side - the number is the subject */
.catline{display:flex;align-items:baseline;gap:14px;margin:28px 0 12px}
.catline h3{font-weight:700;text-transform:uppercase;letter-spacing:.11em;font-size:13px;margin:0}
.catline .rule{flex:1;height:1px;background:var(--line)}
.catline .ct{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted)}
.find,.aw{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr))}
.aw{padding:18px 20px}
.fi,.ac{background:var(--surface);border:1px solid var(--line);
  border-bottom:2px solid var(--line);border-radius:2px;padding:16px 18px 15px;
  display:flex;flex-direction:column;gap:7px}
.fi[data-c="Bragging rights"]{border-bottom-color:color-mix(in oklab,var(--win) 45%,var(--line))}
.fi[data-c="Facepalm"]{border-bottom-color:color-mix(in oklab,var(--loss) 45%,var(--line))}
.fi[data-c="Robbed"]{border-bottom-color:color-mix(in oklab,var(--accent) 45%,var(--line))}
.ac[data-k=mvp],.ac[data-k=sleeper],.ac[data-k=high],.ac[data-k=blowout]{
  border-bottom-color:color-mix(in oklab,var(--win) 45%,var(--line))}
.ac[data-k=facepalm],.ac[data-k=bust],.ac[data-k=low]{
  border-bottom-color:color-mix(in oklab,var(--loss) 45%,var(--line))}
.ac[data-k=lucky],.ac[data-k=robbed]{
  border-bottom-color:color-mix(in oklab,var(--accent) 45%,var(--line))}
.fi .v,.ac .v{font-family:"IBM Plex Mono",monospace;font-size:20px;font-weight:500;
  color:var(--accent);line-height:1.05;font-variant-numeric:tabular-nums}
.fi .t,.ac .t{font-weight:700;text-transform:uppercase;letter-spacing:.07em;font-size:12.5px}
.fi .d,.ac .d{font-size:13px;color:var(--muted);line-height:1.55}
/* season page */
.state{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:0 0 14px}
.pill{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.07em;
  text-transform:uppercase;border:1px solid var(--line);border-radius:2px;padding:3px 9px;
  color:var(--muted)}
.pill.live{border-color:var(--accent);color:var(--accent)}
.banner{margin:18px 20px 0;padding:12px 14px;border:1px dashed var(--line);border-radius:2px;
  font-size:13px;color:var(--muted);line-height:1.6}
.banner b{color:var(--accent);font-weight:600}
.empty{color:var(--muted);font-size:13px;padding:24px 20px;text-align:center;line-height:1.6}
.empty b{color:var(--text);font-weight:600}
/* ---- phones -------------------------------------------------------------
   The desktop layout nests wrap(28) > card > bd(20) > aw(20) > ac(18) of
   padding, which on a 375px screen leaves the content about 190px wide. Pull
   the nesting in and push the number up: on a one-column stack the value is
   the only thing worth leading with. */
@media (max-width:640px){
  .wrap{padding:0 14px}
  main{padding:18px 0 56px}
  .hbar{gap:12px;padding:12px 0}
  .brand{font-size:15px;letter-spacing:.1em}
  .ctl{gap:8px;margin-left:0;width:100%}
  select,input[type=search]{font-size:16px;padding:8px 10px}  /* 16px: iOS zooms below it */
  input[type=search]{width:100%}
  .state{gap:6px;padding:0 0 10px}
  .pill{font-size:10px;padding:3px 7px}
  .card>.hd{padding:13px 14px 11px;gap:8px}
  .card>.bd{padding:14px}
  .card>.ft{padding:11px 14px 13px;font-size:12px}
  .find,.aw{gap:10px}
  .aw{padding:12px}
  .fi,.ac{padding:13px 14px 12px;gap:5px}
  .fi .v,.ac .v{font-size:30px;line-height:1}
  .fi .t,.ac .t{font-size:11px}
  .fi .d,.ac .d{font-size:13.5px;line-height:1.5}
  .catline{margin:20px 0 10px;gap:10px}
  .banner{margin:14px 14px 0;padding:11px 12px}
  .empty{padding:20px 14px}
  th,td{padding:7px 9px}
  td.n{font-size:12.5px}
  .tw{max-height:none}
  .axl{font-size:11px}
  .pick{font-size:13px;padding:9px 10px}
  .dlbl{font-size:12px}
}
.pick{margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:2px;
  background:var(--bg);font-size:13.5px;line-height:1.5;min-height:1em}
.pick b{font-weight:700}
.pick-hint{color:var(--muted);font-style:italic}
.pick-meta{color:var(--muted)}
.pick-num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-weight:600}
.pick-num.up{color:var(--win)}
.pick-num.dn{color:var(--loss)}
svg[tabindex]{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
svg[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ======================================================================
   SEASON TRACKER - the broadcast register. The record book is an almanac
   and stays exactly as above; the tracker is a screen. Same tokens, same
   charts, one more typeface (Barlow Condensed for display only) and the
   team identity kit. Kit colours are IDENTITY: they always sit beside a
   name and a crest and never carry a meaning on their own. Anything the
   reader has to decode stays on the blue/orange pair.
   Scoped to [data-page=season], stamped by the page's own head script.
   ====================================================================== */
[data-page=season] .disp,[data-page=season] h2,[data-page=season] .brand,
[data-page=season] .ac .t,[data-page=season] .fi .t{
  font-family:"Barlow Condensed","Source Sans 3",system-ui,sans-serif}
[data-page=season] h2{font-size:21px;letter-spacing:.06em;font-weight:700}
[data-page=season] .brand{font-size:26px;letter-spacing:.08em}
[data-page=season] .ac .t{font-size:15px;letter-spacing:.06em}
[data-page=season] .catline h3{font-family:"Barlow Condensed","Source Sans 3",sans-serif;
  font-size:16px;letter-spacing:.08em}
/* yard-line rule: a section break drawn as a field, hash marks every ten */
.yard{position:relative;height:20px;margin:2px 0 22px}
.yard:before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.yard:after{content:"";position:absolute;left:0;right:0;top:5px;bottom:5px;
  background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 10%)}
.yard i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  background:var(--ground);padding:0 6px;font-family:"IBM Plex Mono",monospace;
  font-size:9.5px;color:var(--muted);letter-spacing:.1em;font-style:normal}
/* crest: shield with a sash, monogram on top */
.crest{display:inline-block;vertical-align:middle;flex:none}
img.crest{object-fit:contain;border-radius:3px;background:#FBFAF7;padding:1px;
  box-shadow:0 0 0 1.5px var(--k1,var(--line))}
.crest text{font-family:"Barlow Condensed","Source Sans 3",sans-serif;font-weight:700;
  letter-spacing:.02em}
.who{display:inline-flex;align-items:center;gap:8px}
.who .crest{width:20px;height:23px}
/* headshots + NFL marks */
.hs{width:56px;height:56px;border-radius:50%;object-fit:cover;object-position:top;
  background:var(--raised);border:2px solid var(--k1,var(--line));flex:none}
.hs.sm{width:28px;height:28px;border-width:1.5px}
.mark{width:16px;height:16px;object-fit:contain;vertical-align:-3px;margin-right:5px}
/* ---- scoreboard ---- */
.sbg{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(196px,100%),1fr));
  padding:16px 20px 18px}
.sb{background:var(--surface);border:1px solid var(--line);border-radius:2px;
  display:flex;flex-direction:column}
.sb-row{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 10px;
  border-left:4px solid transparent}
.sb-row+.sb-row{border-top:1px solid var(--line)}
.sb-row.win{border-left-color:var(--k1)}
.sb-row .crest{width:30px;height:34px}
.sb-who{flex:1;min-width:0;line-height:1.15}
.sb-who b{display:block;font-family:"Barlow Condensed","Source Sans 3",sans-serif;
  font-size:18px;font-weight:700;letter-spacing:.03em}
.sb-who span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.sb-sc{font-family:"Barlow Condensed","Source Sans 3",sans-serif;font-weight:700;
  font-size:30px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.sb-row:not(.win) .sb-sc,.sb-row:not(.win) .sb-who b{color:var(--muted);font-weight:600}
.sb-row.tbd .sb-sc{font-size:14px;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.sb-ft{display:flex;align-items:center;gap:8px;padding:9px 12px;border-top:1px solid var(--line);
  font-size:12px;color:var(--muted);background:var(--raised)}
.sb-ft .hs{width:26px;height:26px;border-width:1.5px}
.sb-ft b{color:var(--text);font-weight:600}
.sb-ft .mono{font-size:11.5px}
.sb-riv{padding:8px 12px 10px;font-size:11.5px;line-height:1.45;color:var(--muted);
  border-top:1px dashed var(--line)}
.sb-riv b{color:var(--text);font-weight:600}
.sb-riv .lead{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--accent)}
.sb-wk{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);padding:8px 12px 0}
/* ---- award hierarchy: three heroes, then the strip ---- */
.aw-hero{display:grid;gap:16px;padding:18px 20px 4px;
  grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr))}
.ac.hero{padding:18px 20px 16px;gap:10px;border-bottom-width:3px}
.ac.hero .top{display:flex;align-items:center;gap:14px}
.ac.hero .v{font-family:"Barlow Condensed","Source Sans 3",sans-serif;font-size:46px;
  font-weight:700;letter-spacing:.01em;line-height:.95}
.ac.hero .t{font-size:17px}
.ac.hero .d{font-size:13.5px}
.ac.hero .hs{width:64px;height:64px}
.ac .by{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);
  margin-top:auto}
.ac .by .crest{width:16px;height:18px}
.ac .by .hs.sm{margin-right:2px}
/* ---- heat grids: position strength + schedule swap ---- */
.hmw{overflow-x:auto;padding:14px 20px 18px}
.hm{border-collapse:separate;border-spacing:3px;font-family:"IBM Plex Mono",monospace;
  font-size:12.5px;font-variant-numeric:tabular-nums;min-width:100%}
.hm th{font-family:"Barlow Condensed","Source Sans 3",sans-serif;font-size:13px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;
  padding:4px 6px;text-align:center;position:static;background:none;cursor:default;
  border:none;white-space:nowrap}
.hm th:first-child,.hm td:first-child{text-align:left;position:static;background:none;
  font-family:"Source Sans 3",system-ui,sans-serif;font-size:13.5px;padding-right:10px;
  white-space:nowrap}
.hm th .crest{width:18px;height:21px;margin-right:4px;vertical-align:-5px}
.hm td{text-align:center;padding:7px 6px;border:none;border-radius:2px;
  background:var(--raised);color:var(--text);min-width:52px}
.hm td.self{outline:1px solid var(--line);outline-offset:-1px;background:var(--surface);
  color:var(--muted)}
.hm td.hi{color:var(--text);font-weight:600}
.hm tfoot td{background:none;color:var(--muted);font-size:11px;padding-top:2px}
.hm .cap{font-size:10.5px;color:var(--muted);letter-spacing:.06em;font-family:"IBM Plex Mono",monospace}
.legend{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);
  padding:0 20px 14px;flex-wrap:wrap}
.legend i{display:inline-block;width:38px;height:10px;border-radius:2px;font-style:normal}
/* ---- trophy case ---- */
.trophy td.n{font-size:13px}
.trophy .cup{display:inline-block;font-family:"Barlow Condensed","Source Sans 3",sans-serif;
  font-weight:700;font-size:14px;color:var(--accent)}
.trophy .cup.bad{color:var(--loss)}
.trophy .cup.dim{color:var(--line)}
@media (max-width:640px){
  [data-page=season] h2{font-size:19px}
  [data-page=season] .brand{font-size:22px}
  .sbg{padding:12px;gap:10px}
  .sb-sc{font-size:26px}
  .aw-hero{padding:12px 12px 2px;gap:10px}
  .ac.hero .v{font-size:40px}
  .hmw{padding:10px 12px 14px}
  .hm td{min-width:44px;padding:6px 4px;font-size:12px}
}

/* Haust skin (John's Iceland palette, ~/dev/.agents/skills/iceland-palette)
   for the analysis + position stat pages. Overrides the site tokens only under
   [data-skin=haust], so the record book and season tracker are untouched.
   Football read: an overcast late-season ground (mist/frost; basalt at night),
   accents spent only on data - rowan = above expectation and the hero accent,
   glacial = below, birch = "this manager's players". 80/20: the grounds stay
   quiet. Text accent is a darkened rowan (#9A4A18, 5.9:1 on frost) because
   true rowan is 3.9:1 on mist; marks keep true rowan. */
:root[data-skin=haust]{
  --ground:#E8EDF2;--surface:#F6F8FA;--raised:#DCE3EA;--line:#C9D2DB;
  --text:#1F1D18;--muted:#6B6156;--accent:#9A4A18;--accentbg:#F3E3D6;
  --win:#2F6B73;--loss:#B95A1F;--grid:#DCE2E8;
  --rowan:#B95A1F;--glacial:#2F6B73;--birch:#CC9C2E;--birchbg:#F6EDD3;
  --bruar:#4DA3AC;--fissure:#1F1D18;--turf:#E3E9EE}
:root[data-skin=haust][data-theme=dark]{
  --ground:#16191C;--surface:#1F2429;--raised:#272D34;--line:#343C44;
  --text:#E8EDF2;--muted:#9AA5B1;--accent:#E09A5F;--accentbg:#33261D;
  --win:#5BB4BD;--loss:#C96A2E;--grid:#2A3138;
  --rowan:#C96A2E;--glacial:#5BB4BD;--birch:#D6A836;--birchbg:#3A3220;
  --bruar:#5BB4BD;--fissure:#E8EDF2;--turf:#1B2024}
[data-skin=haust] body{background:var(--ground)}
/* position pills: a down-and-distance bar */
.pills{margin:2px 0 10px;display:flex;gap:0;border:1px solid var(--line);width:max-content;max-width:100%;overflow-x:auto}
.pills a{font:700 15px/1 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase;
  padding:8px 14px;color:var(--muted);text-decoration:none;border-right:1px solid var(--line)}
.pills a:last-child{border-right:0}
.pills a[aria-current]{background:var(--fissure);color:var(--ground)}
.pills a:hover{color:var(--accent)}
.num{font-family:'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums}
.own{display:inline-block;font:600 11px/1.5 'Source Sans 3',sans-serif;padding:0 6px;border:1px solid var(--line);

.ps-svg{display:block;width:100%;height:auto}
.ps-svg text{font-family:'Source Sans 3',sans-serif}
.ps-tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);padding:7px 10px;font-size:13px;opacity:0;white-space:nowrap;color:var(--text);z-index:2}

.ps-t th:first-child,.ps-t td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
.ps-t th[data-on]{color:var(--accent)}
.ps-t td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--grid);white-space:nowrap}
.ps-t td:first-child{font-weight:600;min-width:150px}
.ps-t td .tm{font-weight:400;color:var(--muted);margin-left:6px;font-size:12px}
.ps-t td.k{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700}
.ps-t tr:hover td{background:var(--raised)}

fpg":12.6,"xfpg":11.2888,"fpoe":1.3112,"att":45.0,"cmp":0.5778,"cpoe":-6.4078,"epa_db":-0.1798,"adot":7.9556,"pyds":215.0,"ptd":1.0,"int":0.0,"sk":3.0,"ryds":0.0,"rtd":0.0,"own":null,"sc":0},{"n":"Drew Lock","gsis":"00-0035704","team":"SEA","g":2,"snap":0.95,"fpg":17.09,"xfpg":10.8831,"fpoe":6.2069,"att":48.0,"cmp":0.7292,"cpoe":6.8836,"epa_db":0.4507,"adot":7.625,"pyds":422.0,"ptd":4.0,"int":0.0,"sk":2.0,"ryds":13.0,"rtd":0.0,"own":null,"sc":0},{"n":"Jaxson Dart","gsis":"00-0040691","team":"NYG","g":2,"snap":0.56,"fpg":13.7,"xfpg":10.8252,"fpoe":2.8748,"att":34.0,"cmp":0.7647,"cpoe":10.6299,"epa_db":0.5777,"adot":8.5882,"pyds":250.0,"ptd":3.0,"int":0.0,"sk":2.0,"ryds":54.0,"rtd":0.0,"own":null,"sc":0},{"n":"Carson Wentz","gsis":"00-0032950","team":"MIN","g":2,"snap":0.915,"fpg":12.77,"xfpg":9.7936,"fpoe":2.9764,"att":39.0,"cmp":0.5897,"cpoe":-7.8045,"epa_db":0.1222,"adot":7.641,"pyds":276.0,"ptd":3.0,"int":0.0,"sk":6.0,"ryds":5.0,"rtd":0.0,"own":null,"sc":0},{"n":"Marcus Mariota","gsis":"00-0032268","team":"WAS","g":3,"snap":0.5367,"fpg":11.5,"xfpg":8.0873,"fpoe":3.4127,"att":51.0,"cmp":0.6471,"cpoe":3.1919,"epa_db":0.2098,"adot":8.8627,"pyds":340.0,"ptd":4.0,"int":0.0,"sk":3.0,"ryds":49.0,"rtd":0.0,"own":null,"sc":0},{"n":"J.J. McCarthy","gsis":"00-0039923","team":"NYG","g":2,"snap":0.23,"fpg":8.26,"xfpg":7.1285,"fpoe":1.1315,"att":21.0,"cmp":0.5238,"cpoe":5.7411,"epa_db":0.2261,"adot":11.9524,"pyds":243.0,"ptd":1.0,"int":1.0,"sk":1.0,"ryds":28.0,"rtd":0.0,"own":null,"sc":0},{"n":"Cooper Rush","gsis":"00-0033662","team":"ATL","g":2,"snap":0.79,"fpg":2.58,"xfpg":5.6613,"fpoe":-3.0813,"att":39.0,"cmp":0.5641,"cpoe":-13.2038,"epa_db":-0.6354,"adot":4.6923,"pyds":229.0,"ptd":1.0,"int":4.0,"sk":5.0,"ryds":20.0,"rtd":0.0,"own":null,"sc":0}]}</script>
<script>
const D = JSON.parse(document.getElementById('payload').textContent);
const M = D.meta, POS = M.pos;
const $ = s => document.querySelector(s);
const el = (t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;
  if(x!==undefined&&x!==null)n.textContent=x;return n};
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const NAME = {QB:'Quarterbacks',RB:'Running backs',WR:'Receivers',TE:'Tight ends'};
document.title = NAME[POS] + ' \u00b7 ' + M.season;

(function(){
  const root=document.documentElement;
  const btns=[...document.querySelectorAll('.theme button')];
  function apply(t,store){
    if(t==='dark') root.setAttribute('data-theme','dark');
    else root.removeAttribute('data-theme');
    btns.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.t===t)));
    if(store){ try{ localStorage.setItem('ffl-theme',t); }catch(e){} }
    if(window.redraw) window.redraw();
  }
  let cur='light';
  try{ if(localStorage.getItem('ffl-theme')==='dark') cur='dark'; }catch(e){}
  apply(cur,false);
  btns.forEach(b=>b.addEventListener('click',()=>apply(b.dataset.t,true)));
})();

$('#brand').append(document.createTextNode(NAME[POS]+' '));
$('#brand').append(el('span',null,String(M.season)));
$('#backS').href=M.seasonPage; $('#backR').href=M.recordBook;
const pills=$('#pills');
[['Analysis',M.analysisPage]].concat(['QB','RB','WR','TE'].map(p=>[p,M.pages[p]])).forEach(([l,h])=>{
  const a=el('a',null,l);a.href=h;if(l===POS)a.setAttribute('aria-current','page');pills.append(a)});
$('#state').textContent='NFL weeks '+M.nflWeeks[0]+'\u2013'+M.nflWeeks[1]+' \u00b7 fantasy rosters as of league week '+M.rosterWeek+
  ' \u00b7 points scored with this league\u2019s rules (full PPR) \u00b7 '+M.gate+'.';

const fOwn=$('#fOwn');
fOwn.innerHTML='<option value="">All players</option><option value="*">Rostered</option><option value="-">Free agents</option>'+
  M.managers.map(m=>'<option>'+m+'</option>').join('');
try{const s=localStorage.getItem('ffl-own');if(s!==null&&[...fOwn.options].some(o=>o.value===s))fOwn.value=s;}catch(e){}
const fQ=$('#fQ');

const fmt=(v,f)=>{if(v===null||v===undefined)return '\u2013';
  if(f==='i')return Math.round(v).toLocaleString();
  if(f==='1')return v.toFixed(1); if(f==='2')return v.toFixed(2);
  if(f==='pct')return (v*100).toFixed(f==='pct'?0:1)+'%';
  if(f==='pm1')return (v>0?'+':v<0?'\u2212':'')+Math.abs(v).toFixed(1);
  return v};
const own=fOwn.value, match=r=>{const o=fOwn.value,q=fQ.value.trim().toLowerCase();
  if(o==='*'&&!r.own)return false; if(o==='-'&&r.own)return false;
  if(o&&o!=='*'&&o!=='-'&&r.own!==o)return false;
  if(q&&!r.n.toLowerCase().includes(q))return false; return true};
const isMine=r=>{const o=fOwn.value;return o&&o!=='*'&&o!=='-'?r.own===o:o==='-'?!r.own:o==='*'?!!r.own:false};

/* ---------------- scatter: opportunity vs finishing ---------------- */
const SC=D.players.filter(r=>r.sc);
const sc=el('div','card'),shd=el('div','hd');
shd.append(el('h2',null,'Opportunity vs. finishing'));
shd.append(el('span','chip','top '+SC.length+' by xFP/G'));
shd.append(el('div','sub','Right = more valuable volume (expected fantasy points per game). Up = scoring above what that volume usually produces, down = below.'));
const sbd=el('div','bd flush'),swrap=el('div');swrap.style.position='relative';
const tip=el('div','ps-tip');swrap.append(tip);
const svgN=document.createElementNS('http://www.w3.org/2000/svg','svg');svgN.setAttribute('class','ps-svg');
svgN.setAttribute('role','img');svgN.setAttribute('aria-label',NAME[POS]+': expected fantasy points per game versus points above expectation');
swrap.append(svgN);sbd.append(swrap);
const sft=el('div','ft');
sft.innerHTML='<b>How to read it</b> xFP/G comes from the ffopportunity model: each target, carry and pass is valued by what plays like it (down, distance, field position, air yards) are worth on average, then scored with league rules. Logos are each player\u2019s current NFL team.';
sc.append(shd,sbd,sft);$('#scatter').append(sc);

function drawScatter(){
  const phone=matchMedia('(max-width:640px)').matches;
  const W=phone?380:940,H=phone?440:540,m={t:16,r:16,b:44,l:phone?38:48},fs=phone?10.5:12,LG=phone?17:24;
  svgN.setAttribute('viewBox','0 0 '+W+' '+H);
  const svg=d3.select(svgN);svg.selectAll('*').remove();
  const x=d3.scaleLinear(d3.extent(SC,d=>d.xfpg),[m.l+LG/2,W-m.r-LG/2]).nice();
  const yr=d3.max(SC,d=>Math.abs(d.fpoe))*1.08;
  const y=d3.scaleLinear([-yr,yr],[H-m.b,m.t]).nice();
  svg.append('rect').attr('x',m.l).attr('y',m.t).attr('width',W-m.l-m.r).attr('height',y(0)-m.t).attr('style','fill:color-mix(in srgb,var(--rowan) 6%,transparent)');
  svg.append('rect').attr('x',m.l).attr('y',y(0)).attr('width',W-m.l-m.r).attr('height',H-m.b-y(0)).attr('style','fill:color-mix(in srgb,var(--glacial) 6%,transparent)');
  const xt=x.ticks(phone?5:8);
  xt.forEach(t=>{svg.append('line').attr('x1',x(t)).attr('x2',x(t)).attr('y1',m.t).attr('y2',H-m.b).attr('style','stroke:var(--line)');});
  for(let i=0;i<xt.length-1;i++)for(let k=1;k<5;k++){const hx=x(xt[i]+(xt[i+1]-xt[i])*k/5);
    [[m.t,m.t+6],[H-m.b-6,H-m.b]].forEach(([a,b])=>svg.append('line').attr('x1',hx).attr('x2',hx).attr('y1',a).attr('y2',b).attr('style','stroke:var(--line)'));}
  y.ticks(6).forEach(t=>{svg.append('line').attr('x1',m.l).attr('x2',W-m.r).attr('y1',y(t)).attr('y2',y(t)).attr('style','stroke:var(--grid)')
    .attr('stroke-width',t===0?0:1);
    svg.append('text').attr('x',m.l-6).attr('y',y(t)+4).attr('text-anchor','end').attr('font-size',fs).attr('style','fill:var(--muted)').text((t>0?'+':t<0?'\u2212':'')+Math.abs(t));});
  xt.forEach(t=>svg.append('text').attr('x',x(t)).attr('y',H-m.b+16).attr('text-anchor','middle').attr('font-size',fs).attr('style','fill:var(--muted)').text(t));
  svg.append('line').attr('x1',m.l).attr('x2',W-m.r).attr('y1',y(0)).attr('y2',y(0)).attr('style','stroke:var(--fissure);stroke-opacity:.55');
  svg.append('text').attr('x',W-m.r-6).attr('y',m.t+16).attr('text-anchor','end').attr('font-size',fs).attr('style','fill:var(--muted)').text('scoring above the volume');
  svg.append('text').attr('x',W-m.r-6).attr('y',H-m.b-10).attr('text-anchor','end').attr('font-size',fs).attr('style','fill:var(--muted)').text('scoring below the volume');
  svg.append('text').attr('x',(m.l+W-m.r)/2).attr('y',H-8).attr('text-anchor','middle').attr('font-size',fs+1).attr('style','fill:var(--muted)').text('Expected fantasy points per game (xFP/G) \u2192');
  svg.append('text').attr('transform','translate(12,'+((m.t+H-m.b)/2)+') rotate(-90)').attr('text-anchor','middle').attr('font-size',fs+1).attr('style','fill:var(--muted)').text('Points vs. expected, per game');
  const any=fOwn.value!==''||fQ.value.trim()!=='';
  const on=r=>!any||match(r);
  const pts=[...SC].sort((a,b)=>on(a)-on(b));
  const g=svg.append('g');
  g.selectAll('circle').data(pts.filter(r=>any&&on(r)&&isMine(r))).join('circle').attr('cx',d=>x(d.xfpg)).attr('cy',d=>y(d.fpoe)).attr('r',LG/2+3)
    .attr('style','fill:none;stroke:var(--birch);stroke-width:2.5');
  g.selectAll('image').data(pts).join('image').attr('href',d=>'logos/nfl/'+d.team+'.png')
    .attr('x',d=>x(d.xfpg)-LG/2).attr('y',d=>y(d.fpoe)-LG/2).attr('width',LG).attr('height',LG)
    .attr('opacity',d=>on(d)?1:.16)
    .on('mousemove',(e,d)=>{const b=swrap.getBoundingClientRect();tip.style.opacity=1;
      tip.innerHTML='<b>'+d.n+'</b> \u00b7 '+d.team+(d.own?' \u00b7 '+d.own:' \u00b7 free agent')+'<br>xFP/G '+d.xfpg.toFixed(1)+' \u00b7 FP/G '+d.fpg.toFixed(1)+
        '<br>'+(d.fpoe>=0?'+':'\u2212')+Math.abs(d.fpoe).toFixed(1)+' per game vs. expected \u00b7 '+d.g+' G';
      let L=e.clientX-b.left+14;if(L>b.width-230)L-=250;tip.style.left=L+'px';tip.style.top=(e.clientY-b.top-14)+'px'})
    .on('mouseleave',()=>tip.style.opacity=0);
  const placed=[],out=[],cw=fs*.53;
  const order=[...SC].filter(on).sort((a,b)=>(isMine(b)-isMine(a))||b.xfpg-a.xfpg);
  for(const d of order){const cx=x(d.xfpg),cy=y(d.fpoe),nm=d.n.split(' ').filter(w=>!/^(Jr\.?|Sr\.?|II|III|IV|V)$/.test(w)).slice(-1)[0],w=nm.length*cw+2,h=fs+1,rr=LG/2+2;
    for(const [lx,ly,a] of [[cx+rr,cy+4,'start'],[cx-rr,cy+4,'end'],[cx,cy-rr-2,'middle'],[cx,cy+rr+fs,'middle']]){
      const x0=a==='start'?lx:a==='end'?lx-w:lx-w/2,bx=[x0,ly-h+2,x0+w,ly+2];
      if(bx[0]<m.l||bx[2]>W-m.r||bx[1]<m.t||bx[3]>H-m.b)continue;
      if(placed.some(p=>!(bx[2]<p[0]||bx[0]>p[2]||bx[3]<p[1]||bx[1]>p[3])))continue;
      if(SC.some(o=>o!==d&&on(o)&&Math.abs(x(o.xfpg)-Math.max(bx[0],Math.min(x(o.xfpg),bx[2])))<LG/2&&Math.abs(y(o.fpoe)-Math.max(bx[1],Math.min(y(o.fpoe),bx[3])))<LG/2))continue;
      placed.push(bx);out.push({d,lx,ly,a,nm});break}}
  svg.append('g').selectAll('text').data(out).join('text').attr('x',o=>o.lx).attr('y',o=>o.ly).attr('text-anchor',o=>o.a)
    .attr('font-size',fs).attr('style',o=>'fill:var(--text);font-weight:'+(isMine(o.d)?700:400)).text(o=>o.nm);
}

/* ---------------- table ---------------- */
const tc=el('div','card'),thd=el('div','hd');
thd.append(el('h2',null,NAME[POS]+' leaderboard'));
thd.append(el('span','chip','click a column to sort'));
const tw=el('div','ps-tw'),tbl=el('table','ps-t');tw.append(tbl);
const tbd=el('div','bd flush');tbd.append(tw);
const tft=el('div','ft');
tft.innerHTML='<b>Sources</b> nflverse-data stats_player_week, snap_counts and players (nflfastR parse of NFL GSIS); ffverse ffopportunity ep_weekly (expected points). Fantasy points re-scored with league rules and checked against ESPN: 96\u201397% of rostered player-weeks match to the decimal. Hover a column for its definition. Built '+M.generated+'.';
tc.append(thd,tbd,tft);$('#table').append(tc);
const COLS=[{k:'n',l:'Player',f:'s',d:'Player, NFL team, and the league manager who rosters him'}].concat(D.cols);
let sortK='xfpg',sortD=-1;
function drawTable(){
  const rows=D.players.filter(match).sort((a,b)=>{const A=a[sortK],B=b[sortK];
    if(sortK==='n')return sortD*(A<B?-1:A>B?1:0);
    return sortD*((A===null||A===undefined?-1e9:A)-(B===null||B===undefined?-1e9:B))});
  $('#count').textContent=rows.length+' of '+D.players.length+' '+NAME[POS].toLowerCase();
  const th='<thead><tr>'+COLS.map(c=>'<th title="'+c.d.replace(/"/g,'&quot;')+'"'+(c.k===sortK?' data-on':'')+' data-k="'+c.k+'">'+c.l+(c.k===sortK?(sortD<0?' \u25be':' \u25b4'):'')+'</th>').join('')+'</tr></thead>';
  const body=rows.map(r=>'<tr'+(isMine(r)&&fOwn.value&&fOwn.value!=='*'&&fOwn.value!=='-'?' class="mine"':'')+'>'+COLS.map(c=>{
    if(c.k==='n')return '<td>'+r.n+'<span class="tm">'+r.team+'</span>'+(r.own?'<span class="own">'+r.own+'</span>':'')+'</td>';
    const v=r[c.k];let st='',cls='';
    if(c.k==='fpoe'&&v!==null){const a=Math.min(Math.abs(v)/6,1)*30;st=' style="background:color-mix(in srgb,var('+(v>0?'--rowan':'--glacial')+') '+a.toFixed(0)+'%,transparent)"';}
    if(c.k==='xfpg'||c.k==='fpg')cls=' class="k"';
    return '<td'+cls+st+'>'+fmt(v,c.f)+'</td>'}).join('')+'</tr>').join('');
  tbl.innerHTML=th+'<tbody>'+body+'</tbody>';
  tbl.querySelectorAll('th').forEach(h=>h.addEventListener('click',()=>{const k=h.dataset.k;
    if(k===sortK)sortD=-sortD;else{sortK=k;sortD=k==='n'?1:-1}drawTable()}));
}
window.redraw=()=>{drawScatter();drawTable()};
fOwn.addEventListener('change',()=>{try{localStorage.setItem('ffl-own',fOwn.value)}catch(e){}window.redraw()});
fQ.addEventListener('input',window.redraw);
matchMedia('(max-width:640px)').addEventListener('change',drawScatter);
window.redraw();
</script>
